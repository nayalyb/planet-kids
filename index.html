      html += `<div class="section-title">🎁 선물 고르기 <small>코인으로 쿠폰을 사서 모아 둘 수 있어요</small></div>`;
      html += rs.length ? `<div class="shop-grid">${rs.map(r => {
        const pct = Math.max(0, Math.min(1, c.coins / Math.max(1, r.cost)));
        return `<div class="item"><div class="ic">${esc(r.icon)}</div><b>${esc(r.title)}</b><div class="cost">🪙 ${r.cost}</div>
        ${c.coins >= r.cost ? `<button class="btn small block" data-act="reqReward" data-id="${r.id}">쿠폰 사기</button>` : `<div class="tbar" style="--c:var(--gold);width:100%;height:6px"><i style="width:${Math.round(pct * 100)}%"></i></div><small class="muted">${r.cost - c.coins}코인 더 모으면!</small>`}</div>`;
      }).join('')}</div>`
        : '<div class="empty"><div>🎁</div>부모님이 아직 선물을 등록하지 않았어요</div>';
      const used = st.redemptions.filter(r => r.childId === c.id && (r.status === 'approved' || r.status === 'rejected' || r.status === 'confiscated')).slice(-6).reverse();
      if (used.length) {
        html += `<div class="section-title">📮 지난 쿠폰</div>` + used.map(r => `<div class="req"><span>${esc(r.icon)}</span><span class="grow">${esc(r.title)}<br><small class="muted">${fmtTime(r.doneAt || r.ts)}</small></span>
          <b style="color:${r.status === 'approved' ? 'var(--good)' : 'var(--bad)'}">${r.status === 'approved' ? '✅ 사용 완료' : r.status === 'confiscated' ? '👎 벌로 회수' : '↩️ 환불'}</b></div>`).join('');
      }
    } else if (ui.shopSeg === 'deco') {
      PQ.COSMETIC_TYPES.forEach(([type, title]) => {
        html += `<div class="section-title">${title}${type === 'pet' && E.trackInfo(c.energy.kind || 0, PQ.TRACK_THRESHOLDS.kind).level < 2 ? ' <small>펫이 부화하면 보여요</small>' : type === 'fx' ? ' <small>여러 개를 함께 켤 수 있어요</small>' : ''}</div><div class="shop-grid">`;
        html += PQ.COSMETICS.filter(x => x.type === type).map(x => {
          const own = c.owned.indexOf(x.id) >= 0;
          const list = type === 'pet' ? c.petItems : type === 'fx' ? (c.fx || []) : c.ships;
          const on = type === 'theme' ? c.theme === x.id : list.indexOf(x.id) >= 0;
          const btn = own ? `<button class="btn small ${on ? 'good' : 'ghost'} block" data-act="equip" data-id="${x.id}">${on ? (type === 'theme' ? '사용 중' : '켜짐 ✓') : '사용하기'}</button>`
            : c.coins >= x.cost ? `<button class="btn small block" data-act="buy" data-id="${x.id}">구입 🪙${x.cost}</button>` : `<button class="btn small ghost block" disabled>🪙${x.cost}</button>`;
          return `<div class="item ${on ? 'equipped' : ''}"><div class="ic">${x.icon}</div><b>${x.name}</b>${btn}</div>`;
        }).join('') + '</div>';
      });
    } else {
      const count = id => id === 'freeze' ? c.freezes : id === 'crate' ? c.crates : ((c.items || {})[id] || 0);
      html += `<p class="muted" style="margin:0 4px 10px">아이템은 미션을 완료할 때 <b>자동으로</b> 사용돼요.</p><div class="shop-grid">`;
      html += PQ.ITEMS.map(it => {
        const n = count(it.id), full = n >= it.max;
        const btn = full ? '<button class="btn small ghost block" disabled>가득 찼어요</button>' : c.coins >= it.cost ? `<button class="btn small block" data-act="buyItem" data-id="${it.id}">구입 🪙${it.cost}</button>` : `<button class="btn small ghost block" disabled>🪙${it.cost}</button>`;
        const open = it.id === 'crate' && c.crates ? `<button class="btn small good block" data-act="crate">지금 열기 (${c.crates}개)</button>` : '';
        return `<div class="item ${n ? 'equipped' : ''}"><div class="ic">${it.icon}</div><b>${it.name}</b><span class="muted">${it.desc}</span><span class="tag">보유 ${n}/${it.max}</span>${btn}${open}</div>`;
      }).join('') + '</div>';
      html += `<p class="muted" style="margin:10px 4px">📦 보급 상자는 미션 ${PQ.CRATE_EVERY}개마다 1개씩 생겨요 (다음까지 ${PQ.CRATE_EVERY - c.crateProg}개)</p>`;
    }
    return html;
  }

  const couponBusy = new Set();
  async function useCouponFlow(id) {
    if (couponBusy.has(id)) return;
    couponBusy.add(id);
    try { await couponFlowInner(id); } finally { couponBusy.delete(id); }
  }
  async function couponFlowInner(id) {
    const r = st.redemptions.find(x => x.id === id);
    if (!r || (r.status !== 'owned' && r.status !== 'pending')) return;
    const v = await modal(`<div style="margin:6px auto 12px;max-width:320px;border-radius:22px;padding:18px;background:linear-gradient(135deg,#ffd54f,#ff8a65);color:#3a1b00;box-shadow:0 10px 30px rgba(255,170,80,.4)">
        <div style="font-size:64px;line-height:1">${esc(r.icon)}</div><div style="font-size:22px;font-weight:900;margin-top:6px">${esc(r.title)}</div>
        <div style="margin-top:6px;font-weight:700;border-top:2px dashed rgba(58,27,0,.4);padding-top:8px">🎟️ ${esc(child().name)}의 선물 쿠폰</div></div>
      <p>이 화면을 부모님께 보여주세요!</p>
      <div class="actions"><button class="btn good" data-m="pin">👪 부모님 확인 (PIN)</button>${r.status === 'owned' ? '<button class="btn ghost" data-m="ask">부모님께 알림만 보내기</button>' : ''}<button class="btn ghost" data-m="later">나중에</button></div>`);
    if (v === 'ask') { if (!E.useCoupon(st, r.id, now())) return; save(); refresh(); toast('📮', '<b>부모님께 알렸어요</b><small>부모님 모드 ✅승인 탭에서 확인해 주세요</small>'); return; }
    if (v !== 'pin') return;
    if (!(await PQ.Parent.verifyPin('쿠폰 사용 확인', `${esc(r.icon)} ${esc(r.title)} — 부모님 PIN을 입력하면 사용 완료돼요`))) return;
    const cur = st.redemptions.find(x => x.id === id);
    if (!cur || (cur.status !== 'owned' && cur.status !== 'pending')) { toast('ℹ️', '이미 처리된 쿠폰이에요'); refresh(); return; }
    if (cur.status === 'owned') E.useCoupon(st, cur.id, now());
    if (!E.decideRedemption(st, cur.id, true, true)) return;
    save(); refresh();
    A.play('level'); R.confetti();
    modal(`<div class="big-emoji">${esc(r.icon)}</div><h2>쿠폰 사용 완료!</h2><p><b>${esc(r.title)}</b> 즐겁게 누리세요! 😊</p><div class="actions"><button class="btn" data-m="ok">신난다!</button></div>`);
  }

  /* ---------- 도감 ---------- */
  function renderDex(c) {
    const li = E.levelInfo(c.xp, st.settings.levelSpeed);
    const allOpen = li.universe > 0 || li.phase !== 'cycle';
    const found = allOpen ? PQ.STAGES.length : li.stageIdx + 1;
    let html = `<p class="muted" style="margin:4px 4px 12px">행성 → 항성 → 항성계·성단 → 은하 → … 레벨이 오르면 더 큰 천체로 진화해요. 모두 실제로 있는 천체예요! (${found}/${PQ.STAGES.length} 발견)</p>`;
    let lastCat = '';
    PQ.STAGES.forEach((p, i) => {
      const open = allOpen || i <= li.stageIdx;
      if (p.cat !== lastCat) { lastCat = p.cat; html += `<div class="section-title">${open ? PQ.STAGE_CATS[p.cat].icon + ' ' + PQ.STAGE_CATS[p.cat].name : '❔ ???'}</div>`; }
      html += `<div class="card dex">${open ? `<img data-ti="${i}" data-ts="192" alt="">` : '<div class="lockimg">?</div>'}<div class="grow">`;
      if (open) {
        const prev = i > 0 ? PQ.STAGES[i - 1] : null;
        html += `<div class="kind">${i + 1}단계 · ${esc(p.kind)}</div><h3>${esc(p.name)} <small class="muted">${esc(p.en)}</small></h3>
          <dl><dt>크기</dt><dd>${esc(p.sizeText)}</dd><dt>위치</dt><dd>${esc(p.dist)}</dd>${p.cat === 'planet' ? `<dt>하루</dt><dd>${esc(p.day)}</dd><dt>1년</dt><dd>${esc(p.year)}</dd><dt>위성</dt><dd>${esc(p.moonsTotal)}</dd>` : ''}
          ${prev ? `<dt>비교</dt><dd>${esc(prev.name)}보다 약 ${sizeRatio(i, i - 1)}배</dd>` : ''}</dl>
          <ul>${p.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
      } else html += `<div class="kind">${i + 1}단계</div><h3>???</h3><p class="muted">미션을 열심히 하면 만날 수 있어요!</p>`;
      html += '</div></div>';
    });
    return html;
  }

  /* ---------- 장면 터치 ---------- */
  function showTip(x, y, html) {
    const tip = $('#tooltip');
    tip.innerHTML = html;
    tip.classList.add('show');
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(10, Math.min(innerWidth - w - 10, x - w / 2)) + 'px';
    tip.style.top = Math.max(80, Math.min(innerHeight - h - 100, y - h - 24)) + 'px';
    clearTimeout(ui.tipT);
    ui.tipT = setTimeout(() => tip.classList.remove('show'), 3200);
  }
  function onSceneTap(x, y) {
    const hit = R.hitTest(x, y);
    const c = child();
    if (!hit) { $('#tooltip').classList.remove('show'); return; }
    const li = E.levelInfo(c.xp, st.settings.levelSpeed);
    A.play('tap');
    switch (hit.kind) {
      case 'planet': {
        R.wobble(); R.burst(x, y, ['#ffffff', '#9cc3ff', '#ffd54f'], 14, { speed: 180, life: 0.7 });
        const p = li.stage;
        showTip(x, y, `<b>${esc(p.name)} ${ROMAN[li.sub]}</b><small>${esc(PQ.STAGE_CATS[p.cat].name)} · ${esc(p.sizeText)}</small><br>${esc(p.facts[Math.floor(Math.random() * p.facts.length)])}${p.cat === 'planet' || p.cat === 'star' ? '<br><small>👆 옆으로 밀면 돌아가요</small>' : ''}`);
        break;
      }
      case 'compare': showTip(x, y, `<b>🔍 이전 단계: ${esc(hit.prev.name)}</b>지금 단계(${esc(li.stage.name)})는 이전보다 <b>약 ${sizeRatio(li.stageIdx, hit.prev.idx)}배</b> 커요!`); break;
      case 'dad': showTip(x, y, `<b>👨‍💻 우주 창조자 아빠</b>${li.phase === 'family' ? '엄마 말씀 잘 들어야겠죠? 😅' : `작업실 ${li.creatorLv}/${PQ.CREATOR_LEVELS}단계 · 다음: ${esc(PQ.CREATOR_FEATURES[li.creatorLv] || '완성!')}`}`); break;
      case 'mom': showTip(x, y, '<b>👩 엄마</b>"우주보다 우리 가족이 먼저예요!" 💕'); break;
      case 'monitor': showTip(x, y, `<b>🖥️ 우주 모니터</b>${esc(c.name)}이(가) 미션으로 키운 다섯 개의 우주가 여기 들어 있어요!`); break;
      case 'real': showTip(x, y, `<b>🌑 ${esc(hit.data.name)}</b>${esc(li.stage.name)}의 진짜 위성이에요!`); break;
      case 'subject': {
        const ti = E.trackInfo(c.subE[hit.data.id] || 0, PQ.MOON_THRESHOLDS);
        showTip(x, y, `<b>${esc(hit.data.name)} 위성 Lv.${ti.level}</b>${ti.next ? `다음 레벨까지 ${ti.next - ti.energy} 에너지.<br>${esc(hit.data.name)} 공부를 하면 자라요!` : '최고 레벨! 반짝반짝 ✨'}`);
        break;
      }
      case 'station': {
        const t = E.trackInfo(c.energy.help || 0, PQ.TRACK_THRESHOLDS.help);
        showTip(x, y, t.level ? `<b>🛰️ 사랑의 우주정거장 Lv.${t.level}</b>${t.next ? `다음 모듈: ${PQ.STATION_MODULES[t.level + 1]}<br>부모님을 도우면 만들어져요!` : '완공! 최고예요!'}` : '<b>🛰️ 우주정거장 설계도</b>부모님 돕기 미션을 하면 우주정거장이 지어져요!');
        break;
      }
      case 'pet': {
        R.petJump(); A.play('pet');
        const lv = E.trackInfo(c.energy.kind || 0, PQ.TRACK_THRESHOLDS.kind).level;
        const weak = trackStates(c).sort((a, b) => a.score - b.score)[0];
        const tip = Math.random() < 0.5 ? `${PQ.CATS[weak.cat].icon} ${PQ.CATS[weak.cat].name} 미션 하면 ${PQ.CATS[weak.cat].track}이(가) 자라!` : PQ.PET_LINES[Math.floor(Math.random() * PQ.PET_LINES.length)];
        showTip(x, y, lv < 2 ? '<b>🥚 신비한 알</b>착한 일을 하면 알이 부화해요… 꿈틀!' : `<b>${esc(c.petName)}</b>${esc(tip)}`);
        break;
      }
      case 'ring': {
        const a = E.trackInfo(c.energy.arts || 0, PQ.TRACK_THRESHOLDS.arts);
        showTip(x, y, `<b>💫 오색 고리 ${Math.round((a.level + a.frac) / a.max * 100)}%</b>${PQ.RING_STAGES[a.level]} · 예체능 연습으로 고리를 완성해요!`);
        break;
      }
      case 'const': {
        const k = PQ.CONSTELLATIONS[hit.idx], ci = E.constInfo(c.gradeStars);
        showTip(x, y, `<b>✨ ${esc(k.name)}</b>별 ${ci.lit[hit.idx]}/${k.stars.length}개 밝힘 · 좋은 시험 성적으로 별을 밝혀요!`);
        break;
      }
      case 'ship': showTip(x, y, '<b>🚀 부웅~</b>우주선 친구가 행성을 지켜요!'); break;
    }
  }
  function bindScene() {
    const cv = $('#scene');
    let down = null;
    cv.addEventListener('pointerdown', e => {
      A.unlock();
      down = { x: e.clientX, y: e.clientY, lx: e.clientX, t: performance.now(), drag: false };
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    });
    cv.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - down.lx;
      down.lx = e.clientX;
      if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) down.drag = true;
      if (down.drag) R.spin(-dx * 0.0016);
    });
    const up = e => {
      if (!down) return;
      if (!down.drag && performance.now() - down.t < 500) {
        if (ui.tab !== 'home' && !window.matchMedia('(min-width: 900px) and (orientation: landscape)').matches) closeSheet();
        else onSceneTap(e.clientX, e.clientY);
      }
      down = null;
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', () => { down = null; });
  }
  function bindSheetDrag() {
    const sheet = $('#sheet');
    let d = null;
    const start = e => {
      if (e.target.closest('button')) return;
      if (window.matchMedia('(min-width: 900px) and (orientation: landscape)').matches) return;
      d = { y: e.clientY, dy: 0 };
      sheet.classList.add('dragging');
      e.currentTarget.setPointerCapture(e.pointerId);
    };
    const move = e => { if (!d) return; d.dy = Math.max(0, e.clientY - d.y); sheet.style.transform = `translate(-50%, ${d.dy}px)`; };
    const end = () => {
      if (!d) return;
      sheet.classList.remove('dragging');
      sheet.style.transform = '';
      if (d.dy > 110) closeSheet();
      d = null;
    };
    ['.sheet-grab', '.sheet-head'].forEach(s => {
      const el = $(s);
      el.addEventListener('pointerdown', start); el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    });
  }

  /* ---------- 공통 액션 ---------- */
  async function onAction(act, el) {
    const c = child();
    switch (act) {
      case 'tab': openTab(el.dataset.tab); break;
      case 'goMission': ui.focus = el.dataset.id; ui.filter = 'all'; if (ui.tab === 'missions') renderSheet(); else openTab('missions'); break;
      case 'goGift': ui.shopSeg = 'gift'; A.play('gift'); if (ui.tab === 'shop') renderSheet(); else openTab('shop'); break;
      case 'music':
        if (A.isPlaying()) { A.stopMusic(1); setTimeout(updateMusicBtn, 50); toast('🎵', '배경음악을 껐어요'); }
        else if (st.settings.music === false) toast('🔇', '<b>배경음악이 꺼져 있어요</b><small>부모님 모드 ⚙️설정에서 켤 수 있어요</small>');
        else { A.playMusic(E.tierOf(E.levelInfo(c.xp, st.settings.levelSpeed)), 60); updateMusicBtn(); toast('🎵', `<b>${esc(A.themeName())} 테마</b><small>1분 동안 흘러나와요</small>`); }
        break;
      case 'closeSheet': closeSheet(); break;
      case 'filter': ui.filter = el.dataset.f; A.play('tap'); renderSheet(); break;
      case 'shopSeg': ui.shopSeg = el.dataset.s; A.play('tap'); renderSheet(); break;
      case 'parent': A.play('tap'); PQ.Parent.open(); break;
      case 'profiles': openProfiles(); break;
      case 'timeInfo': openTimeInfo(); break;
      case 'streakInfo': {
        const s = E.currentStreak(st, c, now());
        modal(`<div class="big-emoji">🔥</div><h2>${s}일 연속!</h2><p>하루에 미션을 1개 이상 하면 연속 기록이 이어져요.<br>최고 기록: <b>${c.stats.bestStreak}일</b> · 보호막 🛡️ ${c.freezes}개<br>3·7·14·30일마다 보너스 코인!</p><div class="actions"><button class="btn" data-m="ok">알겠어요</button></div>`);
        break;
      }
      case 'reqReward': {
        const r = st.rewards.find(x => x.id === el.dataset.id);
        if (!r) return;
        const v = await modal(`<div class="big-emoji">${esc(r.icon)}</div><h2>${esc(r.title)}</h2><p>🪙 <b>${r.cost}</b> 코인으로 쿠폰을 살까요?<br><small>지금 남은 코인: ${c.coins} → ${c.coins - r.cost}</small></p>
          <div class="actions"><button class="btn ghost" data-m="no">취소</button><button class="btn" data-m="keep">쿠폰함에 넣기</button><button class="btn good" data-m="now">사서 바로 쓰기</button></div>`);
        if (v !== 'keep' && v !== 'now') return;
        const red = E.requestReward(st, c.id, r.id, now());
        if (!red) return;
        A.play('coin'); R.burst(innerWidth / 2, innerHeight / 2, ['#ffd54f', '#fff', '#ff8fab'], 26); commit();
        if (v === 'now') useCouponFlow(red.id); else toast('🎟️', `<b>쿠폰을 샀어요!</b><small>쿠폰함에서 원할 때 사용하세요</small>`);
        break;
      }
      case 'useCoupon': useCouponFlow(el.dataset.id); break;
      case 'buy': if (E.buyCosmetic(st, c.id, el.dataset.id)) { A.play('coin'); R.burst(innerWidth / 2, innerHeight / 2, ['#ffd54f', '#fff'], 24); toast('✨', '<b>구입 완료!</b>'); commit(); } break;
      case 'equip': E.equipCosmetic(st, c.id, el.dataset.id); A.play('tap'); commit(); break;
      case 'buyFreeze': if (E.buyFreeze(st, c.id)) { A.play('coin'); toast('🛡️', '<b>보호막 구입!</b><small>하루를 쉬어도 연속 기록이 지켜져요</small>'); commit(); } break;
      case 'buyItem': {
        const it = PQ.ITEMS.find(x => x.id === el.dataset.id);
        if (it && E.buyItem(st, c.id, it.id)) { A.play('coin'); toast(it.icon, `<b>${esc(it.name)} 구입!</b><small>${esc(it.desc)}</small>`); commit(); }
        break;
      }
      case 'crate': openCrate(); break;
      case 'fact': openFact(); break;
      case 'renamePet': {
        const v = await promptBox('펫 이름 바꾸기', c.petName, 10);
        if (v) { c.petName = v; commit(); }
        break;
      }
    }
  }
  function promptBox(title, value, max) {
    let out = null;
    return modal(`<h2>${title}</h2><div class="form"><input type="text" id="pbox" maxlength="${max || 20}" value="${esc(value || '')}"></div>
      <div class="actions"><button class="btn ghost" data-m="no">취소</button><button class="btn" data-m="ok">저장</button></div>`, {
      onShow(w) { const i = $('#pbox', w); setTimeout(() => i.focus(), 300); },
      onAction(v, w) { if (v === 'ok') out = $('#pbox', w).value.trim(); return true; }
    }).then(() => out);
  }
  function openTimeInfo() {
    const slots = st.settings.timeSlots.slice().sort((a, b) => a.until - b.until);

    if (!st.onboarded || !st.children.length) onboarding().then(afterStart);

  function afterStart() {

  function tick() {

    const dk = E.dayKey(st, now());

    else { updateHome(c); updateHUD(c); if (ui.tab === 'missions' && !document.querySelector('.hold.holding')) renderSheet(); }

  return {

  /* ---------- PIN ---------- */

      wide: true,

  /* 빠진 완료 넣기: 미션 → 날짜 → 실제로 한 시각 → 미리보기 → 저장 */
  function recordModal(c) {
    if (!c) return;
    const s = st(), now = Date.now(), today = E.dayKey(s, now);
    const ms = s.missions.filter(m => m.active && m.type !== 'surprise' && (!m.assignees || !m.assignees.length || m.assignees.indexOf(c.id) >= 0));
    const slots = s.settings.timeSlots.slice().sort((a, b) => a.until - b.until);
    let mid = null, off = 0, si = 0, grade = null;
    const dkOf = o => E.addDays(today, -o);
    const tsOf = (o, i) => {
      const a = dkOf(o).split('-').map(Number);
      const lo = i === 0 ? Math.max(s.settings.dayStartHour + 1, slots[0].until - 2) : slots[i - 1].until;
      const hi = slots[i].until;
      const h = i === 0 ? Math.max(lo, hi - 1.5) : Math.min(hi - 0.25, lo + 0.5);
      let ts = new Date(a[0], a[1] - 1, a[2], Math.floor(h), Math.round((h % 1) * 60)).getTime();
      /* 고른 시간 칸과 실제 계산 칸이 다르면 그 칸 안의 시각을 찾아요 */
      for (let k = 0; k < 48 && E.slotFor(s, ts).idx !== i; k++) ts += (E.slotFor(s, ts).idx < i ? 1 : -1) * 15 * 60000;
      return ts;
    };
    const slotLabel = i => i === 0 ? `${U.hourLabel(slots[0].until)} 전` : i === slots.length - 1 ? `${U.hourLabel(slots[i - 1].until)} 이후` : `${U.hourLabel(slots[i].until)} 전`;
    const dayLabel = o => { const dk = dkOf(o), p = dk.split('-'); return (o === 0 ? '오늘' : o === 1 ? '어제' : DAYS[E.weekdayOf(dk)] + '요일') + ` ${Number(p[1])}/${Number(p[2])}`; };
    const body = () => {
      const m = ms.find(x => x.id === mid);
      const ts = Math.min(tsOf(off, si), now);
      let info = '<p class="muted">미션을 골라 주세요</p>';
      if (m) {
        const stt = E.missionStatus(s, c, m, ts);
        if (!stt.available) info = `<p style="color:#ff8a80">⚠️ ${dayLabel(off)}에는 이 미션이 없는 요일이에요</p>`;
        else if (!stt.canDo) info = `<p style="color:#ff8a80">⚠️ ${dayLabel(off)}에는 이미 ${m.type === 'weekly' && stt.weekDone ? '이번 주 횟수를 모두' : '할 수 있는 만큼'} 완료되어 있어요</p>`;
        else if (m.cat === 'grade' && !grade) info = '<p class="muted">성적 등급을 골라 주세요</p>';
        else { const rw = E.computeReward(s, m, ts, grade); info = `<p>📝 <b>${esc(m.title)}</b> · ${dayLabel(off)} ${new Date(ts).getHours()}시 무렵<br><b style="color:var(--gold)">+${rw.xp} XP · 🪙${rw.coins}</b> <small class="muted">(시간 보너스 ${rw.pct}%)</small></p>`; }
      }
      return `<div class="form"><label>미션</label><div class="opt-grid">${ms.map(x => `<button class="opt ${x.id === mid ? 'on' : ''}" data-rm="${x.id}">${esc(x.icon)} ${esc(x.title)}</button>`).join('')}</div>
        <label>날짜</label><div class="opt-grid">${[0, 1, 2, 3, 4, 5, 6].map(o => `<button class="opt ${o === off ? 'on' : ''}" data-ro="${o}">${dayLabel(o)}</button>`).join('')}</div>
        <label>실제로 한 시각 (늦을수록 시간 보너스가 줄어요)</label><div class="opt-grid">${slots.map((x, i) => `<button class="opt ${i === si ? 'on' : ''}" data-rs="${i}" ${off === 0 && tsOf(0, i) > now ? 'disabled' : ''}>${slotLabel(i)} · ${x.pct}%</button>`).join('')}</div>
        ${m && m.cat === 'grade' ? `<label>성적</label><div class="opt-grid">${PQ.GRADES.map(g => `<button class="opt ${grade === g.id ? 'on' : ''}" data-rg="${g.id}">${g.emoji} ${g.name}</button>`).join('')}</div>` : ''}</div>
        <div class="card" style="margin-top:10px">${info}</div>`;
    };
    return U.modal(`<h2>📝 ${esc(c.name)} · 빠진 완료 넣기</h2><div id="rmBody">${body()}</div>
      <div class="actions"><button class="btn ghost" data-m="no">닫기</button><button class="btn good" data-m="ok">기록 넣기</button></div>`, {
      wide: true,
      onShow(w) {
        w.addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b || b.dataset.m || b.disabled) return;
          if (b.dataset.rm) { mid = b.dataset.rm; grade = null; }
          else if (b.dataset.ro) { off = Number(b.dataset.ro); if (off === 0 && tsOf(0, si) > now) si = 0; }
          else if (b.dataset.rs) si = Number(b.dataset.rs);
          else if (b.dataset.rg) grade = b.dataset.rg;
          else return;
          A.play('tap'); $('#rmBody', w).innerHTML = body();
        });
      },
      onAction(v) {
        if (v !== 'ok') return true;
        const m = ms.find(x => x.id === mid);
        if (!m) { A.play('error'); U.toast('👆', '미션을 골라 주세요'); return false; }
        if (m.cat === 'grade' && !grade) { A.play('error'); U.toast('👆', '성적 등급을 골라 주세요'); return false; }
        const g = grade ? PQ.GRADES.find(x => x.id === grade) : null;
        const r = E.parentRecord(s, c.id, m.id, tsOf(off, si), { grade, gradeLabel: g ? g.name : '' });
        if (!r.ok) { A.play('error'); U.toast('⚠️', r.reason === 'unavailable' ? '그날은 이 미션이 없는 요일이에요' : '그날은 이미 완료되어 있어요'); return false; }
        A.play('done'); U.commit();
        U.toast('📝', `<b>${esc(m.title)} 기록을 넣었어요</b><small>${dayLabel(off)} · +${r.comp.xp} XP · 🪙${r.comp.coins}</small>`, 3200);
        return true;
      }
    });
  }

      case 'importCode': { const v = $('#importTxt').value.trim(); if (v) doImport(v); return; }
      case 'resetAll':
        if (await U.confirmBox('전체 초기화', '정말 모든 기록을 지울까요?', '다음', true) && await U.confirmBox('마지막 확인', '되돌릴 수 없어요. 먼저 백업하는 것을 권장해요.', '모두 지우기', true)) {
          PQ.Main.resetAll();
        }
        return;
    }
  }
  function saveSettings() {
    const s = st(), set = s.settings;
    const slots = set.timeSlots.slice().sort((a, b) => a.until - b.until);
    const dayStart = Number($('#dayStart').value);
    const next = slots.map((x, i) => ({ until: i === slots.length - 1 ? 24 + dayStart : Number($('#su' + i).value), pct: Math.max(0, Math.min(300, Math.round(Number($('#sp' + i).value) || 0))) }));
    for (let i = 0; i < next.length - 1; i++) {
      if (!(next[i].until > dayStart && next[i].until < 24 + dayStart) || (i > 0 && next[i].until <= next[i - 1].until)) { A.play('error'); U.toast('⚠️', '시간은 위에서 아래로 점점 늦어지도록 입력해 주세요'); return; }
      if (next[i + 1].pct > next[i].pct) { A.play('error'); U.toast('⚠️', '늦은 시간일수록 비율이 같거나 작아야 해요'); return; }
    }
    if (next[next.length - 1].pct < 1) { A.play('error'); U.toast('⚠️', '마지막 칸도 1% 이상이어야 해요 (늦게라도 하면 보상)'); return; }
    set.timeSlots = next;
    set.dayStartHour = dayStart;
    PQ.GRADES.forEach(g => { set.gradeXP[g.id] = Math.max(0, Math.round(Number($('#gx_' + g.id).value) || 0)); });
    set.levelSpeed = Number($('#lvSpeed').value);
    set.coinRate = Number($('#coinRate').value);
    set.surpriseMult = Number($('#surMult').value);
    set.combos = $('#combos').checked;
    set.sound = $('#sound').checked;
    set.music = $('#music').checked;
    set.weeklyGoal = { enabled: $('#wgOn').checked, xp: Math.max(0, Math.min(5000, Math.round(Number($('#wgXp').value) || 0))), coins: Math.max(0, Math.min(2000, Math.round(Number($('#wgC').value) || 0))) };
    U.commit();
    U.toast('💾', '<b>설정을 저장했어요</b>');
  }
  function exportFile() {
    const s = st(), d = new Date();
    const name = `planet-kids-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
    const blob = new Blob([E.exportJSON(s)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    U.toast('💾', `<b>백업 파일을 저장했어요</b><small>${name}</small>`);
  }
  async function doImport(text) {
    let ns;
    try { ns = E.importJSON(text); } catch (e) { A.play('error'); U.toast('⚠️', `<b>불러오기 실패</b><small>${esc(e.message)}</small>`, 4000); return; }
    const names = ns.children.map(c => c.name).join(', ');
    if (!(await U.confirmBox('백업 불러오기', `아이: ${esc(names) || '없음'} · 미션 ${ns.missions.length}개<br>지금 기록을 이 백업으로 바꿀까요?`, '불러오기', true))) return;
    PQ.Main.replaceState(ns);
    U.toast('✅', '<b>백업을 불러왔어요</b>');
    render();
  }

  function bind() {
    const root = $('#parent');
    root.addEventListener('click', e => { const el = e.target.closest('[data-pact]'); if (el) act(el.dataset.pact, el); });
    root.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.ptoggle === 'mission') { const m = st().missions.find(x => x.id === t.dataset.id); if (m) { m.active = t.checked; U.commit(); } }
      if (t.dataset.ptoggle === 'reward') { const r = st().rewards.find(x => x.id === t.dataset.id); if (r) { r.active = t.checked; U.commit(); } }
      if (t.id === 'importFile' && t.files && t.files[0]) { const fr = new FileReader(); fr.onload = () => doImport(String(fr.result)); fr.readAsText(t.files[0]); t.value = ''; }
    });
  }

  return { open, close, render, setupPin, bind, verifyPin, isOpen: () => isOpen };
})();

</script>
<script>
/* 플래닛 키즈 - 시작 & 저장 */
window.PQ = window.PQ || {};

PQ.Main = (function () {
  let state = null;

  let loadProblem = false;
  function load() {
    let raw = null;
    try {
      raw = localStorage.getItem(PQ.STORAGE_KEY);
      if (raw) return PQ.Engine.migrate(JSON.parse(raw));
    } catch (e) {
      console.error('저장 데이터를 읽지 못했어요', e);
      loadProblem = true;
      try { localStorage.setItem(PQ.STORAGE_KEY + '.broken.' + Date.now(), raw); } catch (e2) { /* 공간 부족 */ }
    }
    return PQ.Engine.defaultState();
  }
  let warned = false, blocked = false, remote = null;
  function save() {
    if (blocked) return;
    remote = null;
    try { localStorage.setItem(PQ.STORAGE_KEY, JSON.stringify(state)); }
    catch (e) {
      console.error(e);
      if (!warned && PQ.UI) { warned = true; PQ.UI.toast('⚠️', '<b>저장 공간에 저장하지 못했어요</b><small>부모님 모드 → 백업에서 파일로 저장해 주세요</small>', 5000); }
    }
  }
  function replaceState(ns) {
    state = ns;
    PQ.UI.setState(ns);
    save();
    PQ.UI.refresh();
  }

  function start() {
    state = load();
    PQ.Render.init(document.getElementById('scene'), document.getElementById('fx'));
    PQ.Parent.bind();
    PQ.UI.init(state, save);
    let rt = 0;
    const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { PQ.Render.resize(); PQ.UI.refresh(); }, 120); };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    const loop = t => { if (!document.hidden) PQ.Render.frame(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { PQ.UI.refresh(); PQ.UI.drainEvents(); PQ.UI.checkSurprises(); } });
    /* 다른 탭에서 바뀐 기록: 부모님 모드나 창이 열려 있으면 닫힌 뒤에 반영 (그 사이 이 탭에서 저장하면 이 탭 내용이 우선) */
    const busy = () => PQ.Parent.isOpen() || !!document.querySelector('#modals .modal-wrap') || !!document.querySelector('.hold.holding');
    const applyRemote = () => {
      if (!remote || busy()) return;
      const raw = remote; remote = null;
      try { state = PQ.Engine.migrate(JSON.parse(raw)); PQ.UI.setState(state); PQ.UI.refresh(); } catch (err) { /* 무시 */ }
    };
    window.addEventListener('storage', e => {
      if (e.key !== PQ.STORAGE_KEY || !e.newValue || blocked) return;
      remote = e.newValue; applyRemote();
    });
    setInterval(applyRemote, 1000);
    if (loadProblem) setTimeout(() => PQ.UI.toast('⚠️', '<b>이전 저장 데이터를 읽지 못했어요</b><small>원본은 따로 보관했어요. 백업 파일이 있다면 부모님 모드 → 백업에서 불러오세요.</small>', 7000), 1500);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW 등록 실패', e));
    }
  }

  function resetAll() {
    blocked = true;
    try { localStorage.removeItem(PQ.STORAGE_KEY); } catch (e) { /* 무시 */ }
    location.reload();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  return { replaceState, resetAll, get state() { return state; } };
})();

</script>
