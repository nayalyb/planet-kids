<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="플래닛 키즈">
<meta name="description" content="미션으로 키우는 나의 행성 - 어린이 습관 성장 게임">
<title>플래닛 키즈 - 나의 행성 키우기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #060a1f;
  --panel: rgba(18, 22, 54, 0.78);
  --panel2: rgba(255, 255, 255, 0.07);
  --line: rgba(255, 255, 255, 0.13);
  --text: #f4f6ff;
  --sub: #aab3d9;
  --accent: #7c5cff;
  --accent2: #36c2ff;
  --gold: #ffd54f;
  --good: #3ddc97;
  --bad: #ff6b6b;
  --study: #4FC3F7; --arts: #FF7EB6; --help: #FFB74D; --grade: #FFD54F; --kind: #7CE38B;
  --r: 22px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; font-family: var(--font); }
button { font-family: var(--font); color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: default; }
#scene { position: fixed; inset: 0; touch-action: none; z-index: 0; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
#app { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#app > * { pointer-events: auto; }

/* ---------- HUD ---------- */
#hud { position: absolute; top: calc(10px + var(--sat)); left: 12px; right: 12px; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 8px 30px rgba(0,0,0,.35); max-width: 980px; margin: 0 auto; }
.hud-profile { display: flex; align-items: center; gap: 8px; text-align: left; padding: 2px 6px 2px 2px; border-radius: 16px; min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; flex: none;
  background: radial-gradient(circle at 35% 30%, #5b6cff, #2a1f6e); border: 2px solid rgba(255,255,255,.35); }
.hud-name { display: flex; flex-direction: column; min-width: 0; }
.hud-name b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.hud-name small { font-size: 12px; color: var(--sub); white-space: nowrap; }
.hud-xp { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 90px; }
.hud-xp .lv { font-weight: 900; font-size: 15px; padding: 5px 10px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); white-space: nowrap; }
.bar { position: relative; flex: 1; height: 14px; border-radius: 10px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 10px; background: linear-gradient(90deg, #ffd54f, #ff8a65, #ff5fa2);
  transition: width .9s cubic-bezier(.2,.9,.2,1); box-shadow: 0 0 12px rgba(255,180,90,.6); }
.bar > i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: shine 2.4s infinite; }
@keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.hud-xp small { font-size: 12px; color: var(--sub); white-space: nowrap; }
.hud-right { display: flex; align-items: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); font-size: 15px; white-space: nowrap; }
.chip b { font-weight: 900; }
.chip.debt { background: rgba(255,107,107,.22); border-color: rgba(255,107,107,.6); color: #ffb3b3; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); font-size: 20px; display: grid; place-items: center; position: relative; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 900; display: grid; place-items: center; }

.time-chip { position: absolute; top: calc(84px + var(--sat)); left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 14px; font-weight: 700; white-space: nowrap; }
.time-chip .pct { font-weight: 900; padding: 2px 8px; border-radius: 999px; margin-right: 6px; color: #10142e; }

#surpriseBanner { position: absolute; top: calc(128px + var(--sat)); left: 50%; transform: translateX(-50%); }
.surprise-pill { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 18px; font-weight: 800; white-space: nowrap;
  background: linear-gradient(135deg, #ff5f6d, #ffc371); color: #2a0b12; box-shadow: 0 6px 24px rgba(255,120,90,.5); animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

#homeSide { position: absolute; right: 14px; bottom: calc(160px + var(--sab)); display: flex; flex-direction: column; gap: 12px; }
.side-btn.playing { background: linear-gradient(135deg, rgba(124,92,255,.75), rgba(54,194,255,.65)); animation: beat 0.9s infinite; }
@keyframes beat { 0%,100% { transform: scale(1); } 30% { transform: scale(1.08); } }

/* ---------- 행성 화면: 오늘의 퀘스트 · 선물 ---------- */
.home-panel { position: absolute; top: calc(132px + var(--sat)); width: 228px; padding: 12px; border-radius: 22px; background: rgba(14,18,48,.62);
  border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0,0,0,.35);
  transition: opacity .3s, transform .3s; animation: panelIn .6s cubic-bezier(.2,.9,.25,1) both; }
@keyframes panelIn { from { opacity: 0; transform: translateY(-10px) scale(.97); } }
#questPanel { left: 14px; }
#giftPanel { right: 14px; }
.hp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.hp-title { display: flex; flex-direction: column; font-weight: 900; font-size: 15px; line-height: 1.2; min-width: 0; }
.hp-title small { font-weight: 700; font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp-ico { font-size: 26px; filter: drop-shadow(0 0 8px rgba(255,200,120,.6)); }
.hp-ring { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--good) calc(var(--p) * 360deg), rgba(255,255,255,.12) 0); }
.hp-ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #121640; }
.hp-ring b { position: relative; font-size: 14px; }
.q-list { display: flex; flex-direction: column; gap: 5px; }
.q-row { display: flex; align-items: center; gap: 7px; width: 100%; padding: 7px 8px; border-radius: 12px; text-align: left; font-size: 13px; font-weight: 700;
  background: rgba(255,255,255,.06); box-shadow: inset 3px 0 0 var(--c); transition: transform .15s, background .2s; min-height: 38px; }
.q-row:active { transform: scale(.96); }
.q-row .qi { font-size: 18px; width: 22px; text-align: center; flex: none; }
.q-row .qt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-row .qx { flex: none; font-size: 11.5px; font-weight: 900; color: var(--gold); }
.q-row.hot { background: linear-gradient(90deg, rgba(255,138,101,.28), rgba(255,255,255,.05)); animation: hotGlow 1.8s infinite; }
@keyframes hotGlow { 0%,100% { box-shadow: inset 3px 0 0 var(--c); } 50% { box-shadow: inset 3px 0 0 var(--c), 0 0 14px rgba(255,138,101,.55); } }
.q-more { width: 100%; margin-top: 5px; padding: 5px; border-radius: 10px; font-size: 12px; color: var(--sub); background: rgba(255,255,255,.04); }
.q-done { text-align: center; font-weight: 900; padding: 10px 0 4px; font-size: 15px; }
.q-done small { display: block; color: var(--sub); font-weight: 600; font-size: 12px; }
.q-week { position: relative; width: 100%; margin-top: 8px; padding: 7px 8px 9px; border-radius: 12px; font-size: 12px; font-weight: 800; text-align: left; background: rgba(255,213,79,.1); overflow: hidden; }
.q-week span { position: relative; z-index: 1; }
.q-week i { position: absolute; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, #ffd54f, #ff8a65); border-radius: 2px; }
.q-week.ok { background: rgba(61,220,151,.16); }
.q-week.lost { background: rgba(255,255,255,.05); color: var(--sub); }
.g-coupons { display: flex; align-items: center; gap: 4px; width: 100%; padding: 7px 9px; margin-bottom: 8px; border-radius: 12px; font-size: 12.5px; font-weight: 800;
  background: linear-gradient(135deg, rgba(255,213,79,.35), rgba(255,138,101,.3)); box-shadow: 0 0 16px rgba(255,190,90,.35); animation: pulse 2s infinite; }
.g-coupons b { color: var(--gold); margin-right: 4px; }
.g-orbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 6px; }
.g-orb { position: relative; width: 60px; height: 60px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; transition: transform .15s; }
.g-orb:active { transform: scale(.92); }
.g-orb .ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#ffd54f calc(var(--p) * 360deg), rgba(255,255,255,.13) 0); }
.g-orb .ring::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2b2f6e, #121640); }
.g-orb .ic { position: relative; font-size: 26px; filter: grayscale(.55) brightness(.85); }
.g-orb small { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 900; color: var(--sub); background: #121640; padding: 0 5px; border-radius: 6px; }
.g-orb.ok .ic { filter: none; animation: giftBob 2.2s infinite ease-in-out; }
.g-orb.ok .ring { background: conic-gradient(#ffd54f, #ff8fab, #7c5cff, #36c2ff, #ffd54f); animation: orbSpin 3s linear infinite; box-shadow: 0 0 18px rgba(255,213,79,.55); }
.g-orb.ok em { position: absolute; right: -2px; top: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--good); color: #062; font-style: normal; font-size: 12px; font-weight: 900; display: grid; place-items: center; box-shadow: 0 0 10px rgba(61,220,151,.8); }
@keyframes orbSpin { to { transform: rotate(360deg); } }
@keyframes giftBob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.08); } }
body.sheet-open #app > .home-panel { opacity: 0; pointer-events: none; transform: translateY(-8px); }
.mcard.flash { animation: flashCard 1.6s ease-out; }
@keyframes flashCard { 0%,40% { box-shadow: 0 0 0 3px var(--gold), 0 0 26px rgba(255,213,79,.6); } 100% { box-shadow: none; } }

/* ---------- 진화 등급별 HUD (레벨이 오를수록 화려하게) ---------- */
body.tier-1 .hud-xp .lv { background: linear-gradient(135deg, #ff9a3c, #ffd54f); color: #3a1b00; }
body.tier-2 .hud-xp .lv { background: linear-gradient(135deg, #ffd54f, #fff3b0, #ffb74d); color: #3a2400; box-shadow: 0 0 14px rgba(255,213,79,.55); }
body.tier-3 .hud-xp .lv { background: linear-gradient(135deg, #9b6bff, #ff8fab); box-shadow: 0 0 14px rgba(155,107,255,.6); }
body.tier-4 .hud-xp .lv { background: linear-gradient(135deg, #ff5fa2, #ffd54f, #7c5cff); box-shadow: 0 0 16px rgba(255,95,162,.6); }
body.tier-5 .hud-xp .lv { background: linear-gradient(135deg, #36c2ff, #7c5cff, #36ffd0); box-shadow: 0 0 18px rgba(54,194,255,.7); }
body.tier-6 .hud-xp .lv, body.tier-7 .hud-xp .lv { background: linear-gradient(90deg, #ff6b6b, #ffd54f, #3ddc97, #36c2ff, #7c5cff, #ff6b6b); background-size: 300% 100%; animation: rainbowLv 4s linear infinite; box-shadow: 0 0 20px rgba(255,255,255,.45); }
body.tier-7 #hud { box-shadow: 0 8px 30px rgba(0,0,0,.35), 0 0 24px rgba(255,240,200,.25); border-color: rgba(255,240,200,.35); }
body.tier-8 .hud-xp .lv { background: linear-gradient(135deg, #00ffa3, #00c2ff); color: #00281a; font-family: ui-monospace, Consolas, monospace; box-shadow: 0 0 16px rgba(0,255,163,.6); }
body.tier-9 .hud-xp .lv { background: linear-gradient(135deg, #ff9ec7, #ffd1a1); color: #4a1530; box-shadow: 0 0 16px rgba(255,158,199,.6); }
@keyframes rainbowLv { to { background-position: 300% 0; } }
.side-btn { width: 60px; height: 60px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 28px; position: relative; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); transition: transform .15s; }
.side-btn:active { transform: scale(.92); }
.side-btn.bounce { animation: bounce 1.2s infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } 60% { transform: translateY(-3px); } }
.side-btn small { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--sub); white-space: nowrap; }

#balance { position: absolute; left: 50%; bottom: calc(96px + var(--sab)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 13px; white-space: nowrap; cursor: pointer; }
.dots { display: flex; gap: 6px; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; background: rgba(255,255,255,.08); border: 2px dashed rgba(255,255,255,.25); filter: grayscale(1); opacity: .7; transition: all .4s; }
.dot.on { filter: none; opacity: 1; border-style: solid; transform: scale(1.08); box-shadow: 0 0 12px currentColor; }
#balance .hint { color: var(--sub); }
#balance .hint b { color: var(--gold); }

/* ---------- 탭바 ---------- */
#tabbar { position: absolute; left: 50%; bottom: calc(12px + var(--sab)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px;
  border-radius: 24px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 40; }
.tab { width: 74px; height: 62px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--sub); position: relative; transition: background .2s, color .2s, transform .15s; }
.tab span { font-size: 24px; line-height: 1; }
.tab.active { background: linear-gradient(135deg, rgba(124,92,255,.55), rgba(54,194,255,.45)); color: #fff; }
.tab:active { transform: scale(.94); }
.tab .badge { top: 2px; right: 6px; font-size: 11px; line-height: 20px; }

/* ---------- 시트 ---------- */
#sheetBackdrop { position: fixed; inset: 0; background: rgba(3,5,20,.45); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 30; }
#sheetBackdrop.open { opacity: 1; pointer-events: auto; }
#sheet { position: fixed; left: 50%; bottom: 0; width: min(760px, 100%); height: calc(100% - 96px - var(--sat)); transform: translate(-50%, 105%);
  background: rgba(14,18,46,.94); border: 1px solid var(--line); border-bottom: 0; border-radius: 28px 28px 0 0; z-index: 35;
  transition: transform .42s cubic-bezier(.2,.9,.25,1); display: flex; flex-direction: column; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 -10px 40px rgba(0,0,0,.45); }
#sheet.open { transform: translate(-50%, 0); }
#sheet.dragging { transition: none; }
.sheet-grab { padding: 10px 0 4px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.sheet-grab i { width: 48px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 20px 10px; touch-action: none; }
.sheet-head h2 { margin: 0; font-size: 22px; font-weight: 900; }
.close-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--panel2); font-size: 20px; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px calc(110px + var(--sab)); overscroll-behavior: contain; }
@media (min-width: 900px) and (orientation: landscape) {
  #sheet { left: auto; right: 0; top: 0; bottom: 0; height: 100%; width: min(500px, 46vw); border-radius: 28px 0 0 28px; border: 1px solid var(--line); transform: translateX(105%); }
  #sheet.open { transform: translateX(0); }
  .sheet-grab { display: none; }
  .sheet-head { padding-top: calc(18px + var(--sat)); }
  #sheetBackdrop.open { opacity: 0; pointer-events: none; }
  .sheet-body { padding-bottom: 30px; }
  body.sheet-open #tabbar { left: calc((100% - min(500px, 46vw)) / 2); }
  body.sheet-open #hud { right: calc(min(500px, 46vw) + 12px); }
  #hud { transition: right .4s cubic-bezier(.2,.9,.25,1); }
  body.sheet-open #balance, body.sheet-open #homeSide { opacity: 0; pointer-events: none; }
}
body.sheet-open #timeChip, body.sheet-open #surpriseBanner { opacity: 0; pointer-events: none; }
#timeChip, #surpriseBanner, #balance, #homeSide { transition: opacity .3s; }

/* ---------- 공용 카드/버튼 ---------- */
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 4px 10px; font-size: 16px; font-weight: 900; }
.section-title small { font-size: 12px; color: var(--sub); font-weight: 600; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 20px; border-radius: 16px; font-weight: 800; font-size: 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 6px 18px rgba(90,80,255,.35); transition: transform .12s, filter .2s; }
.btn:active { transform: scale(.96); }
.btn.ghost { background: var(--panel2); border: 1px solid var(--line); box-shadow: none; }
.btn.warn { background: linear-gradient(135deg, #ff6b6b, #ff9a5a); box-shadow: 0 6px 18px rgba(255,100,90,.3); }
.btn.good { background: linear-gradient(135deg, #22c38e, #4fd1c5); box-shadow: 0 6px 18px rgba(40,200,150,.3); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn.block { width: 100%; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.muted { color: var(--sub); font-size: 13px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; padding: 9px 14px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-weight: 700; font-size: 14px; white-space: nowrap; }
.fchip.on { background: #fff; color: #161a3a; }

/* 시간 보너스 바 */
.timebar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 4px 0 6px; }
.timebar div { padding: 8px 2px; border-radius: 12px; text-align: center; font-size: 11px; color: var(--sub); background: rgba(255,255,255,.05); line-height: 1.3; }
.timebar div b { display: block; font-size: 15px; color: #fff; }
.timebar div.now { background: linear-gradient(135deg, #ffd54f, #ff9f5a); color: #3a2400; transform: scale(1.04); box-shadow: 0 4px 16px rgba(255,190,80,.4); }
.timebar div.now b { color: #2a1700; }
.timebar div.past { opacity: .4; }
.timenote { text-align: center; font-size: 14px; font-weight: 700; margin-bottom: 8px; }

/* 미션 카드 */
.cat-head { display: flex; align-items: center; gap: 8px; margin: 18px 4px 8px; font-weight: 900; font-size: 17px; }
.cat-head small { font-weight: 600; color: var(--sub); font-size: 12px; }
.cat-head .cbar { width: 6px; height: 22px; border-radius: 3px; }
.mcard { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; background: var(--panel2); border: 1px solid var(--line); margin-bottom: 10px;
  position: relative; overflow: hidden; transition: transform .2s, opacity .3s; }
.mcard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.micon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; flex: none; background: rgba(255,255,255,.08); }
.mbody { flex: 1; min-width: 0; }

.req { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.05); margin-bottom: 6px; font-size: 14px; }

/* 도감 */
.dex { display: flex; gap: 14px; align-items: flex-start; }
.dex img, .dex .lockimg { width: 96px; height: 96px; flex: none; }
.dex .lockimg { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2b2f55, #0b0e24); display: grid; place-items: center; font-size: 34px; color: var(--sub); }

/* ---------- 모달 ---------- */
#modals { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.modal-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(3,5,20,.6); pointer-events: auto;
  opacity: 0; transition: opacity .25s; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

.modal { width: min(460px, 100%); max-height: calc(100% - 20px); overflow-y: auto; background: linear-gradient(170deg, #1d2260, #121538); border: 1px solid rgba(255,255,255,.18);

.facts { text-align: left; background: rgba(255,255,255,.06); border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.6; margin-top: 8px; }

.pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }

/* 폼 */

  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--text); font-size: 16px; outline: none; }

.opt-grid { display: flex; flex-wrap: wrap; gap: 6px; }

.emoji-grid button.on { background: #fff; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; font-weight: 700; font-size: 15px; }

.switch i { width: 52px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.2); position: relative; transition: background .2s; flex: none; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }

.plist { display: flex; flex-direction: column; gap: 8px; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.report .col em { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-size: 10px; font-style: normal; color: var(--sub); }

/* 토스트 & 말풍선 */
#toasts { position: fixed; top: calc(96px + var(--sat)); left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: min(92vw, 460px); }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 18px; background: rgba(20,24,64,.95); border: 1px solid rgba(255,255,255,.2);
  box-shadow: 0 10px 30px rgba(0,0,0,.45); font-weight: 800; font-size: 15px; animation: toastIn .45s cubic-bezier(.2,1.4,.4,1); max-width: 100%; }

@keyframes toastOut { to { transform: translateY(-14px); opacity: 0; } }
#tooltip { position: fixed; z-index: 55; max-width: 260px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.96); color: #1b1f45; font-size: 14px; font-weight: 600; line-height: 1.45;
  box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; transform: translateY(8px) scale(.95); transition: opacity .2s, transform .2s; pointer-events: none; word-break: keep-all; }
#tooltip.show { opacity: 1; transform: none; }
#tooltip b { display: block; font-size: 15px; margin-bottom: 2px; }

/* 작은 화면 */
@media (max-width: 600px) {

  .side-btn { width: 52px; height: 52px; font-size: 24px; }

  .home-panel { top: calc(124px + var(--sat)); width: auto; max-width: 46vw; padding: 8px; border-radius: 18px; }
  .hp-head { margin-bottom: 6px; gap: 6px; }

  .q-row { width: 40px; height: 40px; min-height: 0; padding: 0; justify-content: center; box-shadow: inset 0 -3px 0 var(--c); }

  .chip { padding: 7px 9px; font-size: 13px; }
}

  #balance { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

      if (parts.hearts.length < 14 && Math.random() < dt * 3) parts.hearts.push({ x: Math.random() * L.W, y: L.H + 20, s: 6 + Math.random() * 8, v: 30 + Math.random() * 40, ph: Math.random() * 6 });
      parts.hearts = parts.hearts.filter(h => h.y > -30);
      parts.hearts.forEach(h => { h.y -= h.v * dt; ctx.fillStyle = 'rgba(255,110,160,0.75)'; heart(ctx, h.x + Math.sin(t * 2 + h.ph) * 10, h.y, h.s); ctx.fill(); });
    }
    if (has('fx_snow')) {
      while (parts.snow.length < 60) parts.snow.push({ x: Math.random() * L.W, y: Math.random() * L.H, s: 1 + Math.random() * 2.5, v: 15 + Math.random() * 25, ph: Math.random() * 6 });
      ctx.fillStyle = 'rgba(240,248,255,0.85)';
      parts.snow.forEach(p => { p.y += p.v * dt; if (p.y > L.H) p.y = -5; ctx.beginPath(); ctx.arc(p.x + Math.sin(t + p.ph) * 12, p.y, p.s, 0, TAU); ctx.fill(); });
    }
    if (has('fx_fireworks')) {
      parts.fw -= dt;
      if (parts.fw <= 0) { parts.fw = 2.5 + Math.random() * 2; const cols = [['#ff6b6b', '#ffd93d'], ['#4d96ff', '#b983ff'], ['#6bcb77', '#ffffff']][Math.floor(Math.random() * 3)]; burst(L.W * (0.15 + Math.random() * 0.7), L.H * (0.18 + Math.random() * 0.2), cols, 40, { speed: 220, life: 1.3, g: 60, drag: 0.6 }); }
    }
  }

  /* ---------- 메인 프레임 ---------- */
  function frame(now) {
    if (!S.vm) return;
    const t = now / 1000, dt = Math.min(0.05, S.last ? t - S.last : 0.016);
    S.last = t; S.t = t;
    const ctx = S.ctx, dpr = S.dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S.objects = [];
    if (S.trans) {
      S.trans.t += dt / (S.trans.big ? 2.6 : 1.6);
      if (S.trans.t >= 0.5 && (S.shownIdx !== S.trans.idx || S.shownU !== S.trans.u || S.shownPhase !== S.trans.phase)) {
        S.shownIdx = S.trans.idx; S.shownU = S.trans.u; S.shownPhase = S.trans.phase; S.dispR *= 0.6;
      }
      if (S.trans.t >= 1) S.trans = null;
    }
    const L = layout(), vm = S.vm, p = L.p;
    S.dispR += (L.targetR - S.dispR) * Math.min(1, dt * 3);
    S.ringP += (vm.ringP - S.ringP) * Math.min(1, dt * 2.5);
    const R = S.dispR * (1 + 0.04 * Math.sin(S.planetWobble * 18) * S.planetWobble);
    S.planetWobble = Math.max(0, S.planetWobble - dt * 1.5);
    S.rot += dt * (0.012 * (p.spin || 0.3)) + S.spinVel * dt;
    S.spinVel *= Math.pow(0.15, dt);
    S.pulse = Math.max(0, S.pulse - dt * 0.6);

    drawBackground(ctx, L, t, dt);
    PQ.Cosmos.drawUniverseFx(ctx, L.W, L.H, t, dt, L.u);
    drawGrandeur(ctx, L, t, dt);

    let center = { x: L.cx, y: L.cy, R }, studio = null;
    if (L.studio) {
      studio = PQ.Cosmos.drawStudio(ctx, L.W, L.H, t, { creatorLv: vm.creatorLv, phase: S.shownPhase, u: L.u, kidName: vm.kidName });
      studio.hits.forEach(h => S.objects.push(h));
      center = { x: studio.monCx, y: studio.monCy, R: studio.monH * 0.32 };
    }
    const Lc = Object.assign({}, L, { cx: center.x, cy: center.y });
    const vmr = Object.assign({}, vm, { ringP: S.ringP });
    const orb = buildOrbiters(Lc, center.R);
    const Ru = orb.ringUnit;
    const ringInfo = L.studio ? null : buildRing(p, vmr, Ru);
    const c = Math.cos(orb.tz), s = Math.sin(orb.tz);
    const placed = orb.list.map(o => {
      const th = o.phase + t * o.speed;
      const lx = Math.cos(th) * o.a, ly = Math.sin(th) * o.a * orb.q;
      return { o, x: Lc.cx + lx * c - ly * s, y: Lc.cy + lx * s + ly * c, z: Math.sin(th), lx, ly };
    });
    const rainbow = (vm.fx || []).indexOf('fx_orbit') >= 0;
    orb.list.forEach((o, i) => {
      ctx.save(); ctx.translate(Lc.cx, Lc.cy); ctx.rotate(orb.tz); ctx.scale(1, orb.q);
      ctx.strokeStyle = rainbow ? `hsla(${(i * 47 + t * 40) % 360},85%,65%,0.4)` : o.kind === 'subject' ? 'rgba(160,200,255,0.10)' : o.kind === 'station' ? 'rgba(255,190,110,0.10)' : 'rgba(255,255,255,0.07)';
      ctx.lineWidth = (rainbow ? 2 : 1) / orb.q; ctx.beginPath(); ctx.arc(0, 0, o.a, 0, TAU); ctx.stroke(); ctx.restore();
    });
    const drawOrb = (pl) => {
      const o = pl.o;
      const r = o.size * (0.85 + 0.15 * (pl.z + 1) / 2);
      if (o.kind === 'real') ball(ctx, pl.x, pl.y, r, o.color, o.style);
      else if (o.kind === 'subject') drawSubjectMoon(ctx, Object.assign({}, o, { size: r }), pl.x, pl.y, t);
      else if (o.kind === 'station') drawStation(ctx, pl.x, pl.y, r, o.level, t);
      S.objects.push({ kind: o.kind, data: o, x: pl.x, y: pl.y, r: Math.max(r * (o.kind === 'station' ? 1.4 : 1.2), 18), z: pl.z });
    };
    placed.filter(pl => pl.z < 0).sort((a, b) => a.z - b.z).forEach(drawOrb);

    if (!L.studio) {
      drawRingHalf(ctx, L, Ru, true, ringInfo, Math.sin(p.tiltX), p.tiltZ, p, vmr);
      if (p.cat === 'planet' || p.cat === 'star') {
        const D = detailOf(p);
        if (p.cat === 'star') PQ.Cosmos.drawStarBack(ctx, p, L.cx, L.cy, R, t, L.u, D);
        const atA = (p.atmoA || 0.4) * (1 + D * 0.6);
        if (p.atmo) glow(ctx, L.cx, L.cy, R * (1.22 + D * 0.1), PQ.Cosmos.tint(hexRgb(p.atmo), L.u), 0.32 * atA);
        if (S.pulse > 0) glow(ctx, L.cx, L.cy, R * (1.2 + (1 - S.pulse) * 0.8), [255, 255, 255], 0.5 * S.pulse);
        const Sz = clamp(Math.round(R * 2 * dpr), 32, Math.round(460 + 340 * D));
        S.sphere.setup(Sz, p, getTexture(p.id, 512, L.u));
        const pc = S.sphere.draw(S.rot);
        ctx.imageSmoothingEnabled = true;
        const ob = p.oblate || 1;
        ctx.drawImage(pc, L.cx - R, L.cy - R * ob, R * 2, R * 2 * ob);
        if (p.atmo) {
          const a = PQ.Cosmos.tint(hexRgb(p.atmo), L.u);
          const g = ctx.createRadialGradient(L.cx, L.cy, R * 0.86, L.cx, L.cy, R * 1.07);
          g.addColorStop(0, rgbStr(a, 0)); g.addColorStop(0.8, rgbStr(a, 0.45 * atA)); g.addColorStop(1, rgbStr(a, 0));
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(L.cx, L.cy, R * 1.07, 0, TAU); ctx.fill();
        }
        if (p.cat === 'planet' && GAS[p.id] && D > 0.3) {
          const tz = p.tiltZ, ct = Math.cos(p.tiltX);
          const ax = L.cx + R * 0.9 * ct * Math.sin(tz), ay = L.cy - R * 0.9 * ct * Math.cos(tz);
          ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(ax, ay); ctx.rotate(tz);
          const pul = 0.6 + 0.4 * Math.sin(t * 1.7);
          [[120, 255, 180], [200, 120, 255]].forEach((col, i) => {
            ctx.strokeStyle = rgbStr(PQ.Cosmos.tint(col, L.u), 0.35 * D * pul / (i + 1));
            ctx.lineWidth = R * (0.05 - i * 0.02); ctx.beginPath(); ctx.ellipse(0, R * 0.04, R * (0.26 + i * 0.06), R * (0.07 + i * 0.02), 0, 0, TAU); ctx.stroke();
          });
          ctx.restore();
        }
        if (p.cat === 'star') PQ.Cosmos.drawStarFront(ctx, p, L.cx, L.cy, R, t, L.u, D);
      } else {
        if (S.pulse > 0) glow(ctx, L.cx, L.cy, R * (0.6 + (1 - S.pulse) * 0.6), [255, 255, 255], 0.35 * S.pulse);
        PQ.Cosmos.drawDeep(ctx, p, L.cx, L.cy, R, t, L.u, L.md);
      }
      S.objects.push({ kind: 'planet', x: L.cx, y: L.cy, r: p.cat === 'planet' || p.cat === 'star' ? R : R * 0.75, z: 0 });
      drawRingHalf(ctx, L, Ru, false, ringInfo, Math.sin(p.tiltX), p.tiltZ, p, vmr);
      if (ringInfo && S.ringP > 0 && S.ringP < 0.6) {
        const cover = Math.min(1, 0.14 + S.ringP * 1.45), ang = Math.PI * 0.5 + cover * TAU;
        const bands = ringBands(p, vmr), mid = bands.length ? (bands[0].a + bands[0].b) / 2 : 1.7;
        const lx = Math.cos(ang) * mid * Ru, ly = Math.sin(ang) * mid * Ru * Math.sin(p.tiltX);
        const x = L.cx + lx * Math.cos(p.tiltZ) - ly * Math.sin(p.tiltZ), y = L.cy + lx * Math.sin(p.tiltZ) + ly * Math.cos(p.tiltZ);
        glow(ctx, x, y, Ru * 0.12 * (1 + 0.3 * Math.sin(t * 6)), [255, 230, 255], 0.8);
      }
      if (ringInfo || p.rings) S.objects.push({ kind: 'ring', x: L.cx, y: L.cy, r: Ru * 2.2, z: -0.5 });
      drawCompare(ctx, L, R, t);
    }
    if (S.trans) {
      const f = 1 - Math.abs(S.trans.t - 0.5) * 2;
      glow(ctx, L.cx, L.cy, R * (1.1 + f * 0.9), [255, 255, 255], 0.95 * f);
      if (S.trans.big) { ctx.fillStyle = `rgba(255,255,255,${0.9 * f})`; ctx.fillRect(0, 0, L.W, L.H); }
    }

    placed.filter(pl => pl.z >= 0).sort((a, b) => a.z - b.z).forEach(drawOrb);

    const ships = vm.ships || [];
    ships.forEach((id, i) => {
      const n = ships.length, th = t * 0.16 + i * TAU / n;
      const ex = L.W * (0.36 + 0.05 * (i % 2)), ey = L.H * (0.1 + 0.03 * (i % 3));
      const x = L.cx + Math.cos(th) * ex, y = L.cy + Math.sin(th * 2) * ey + (i % 2 ? -1 : 1) * L.H * 0.06;
      const dx = -Math.sin(th) * ex, dy = Math.cos(th * 2) * 2 * ey;
      const item = PQ.COSMETICS.find(x2 => x2.id === id);
      ctx.save(); ctx.translate(x, y);
      if (id === 'ship_rocket') ctx.rotate(Math.atan2(dy, dx) + Math.PI / 4);
      else if (dx < 0 && (id === 'ship_whale' || id === 'ship_dragon' || id === 'ship_unicorn')) ctx.scale(-1, 1);
      ctx.font = `${Math.round(L.md * 0.045)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(item ? item.icon : '🛸', 0, 0); ctx.restore();
      S.objects.push({ kind: 'ship', x, y, r: L.md * 0.04, z: 5 });
    });
    drawCosmeticFx(ctx, L, Lc.cx, Lc.cy, L.studio ? center.R * 2 : (p.cat === 'planet' || p.cat === 'star' ? R : Ru * 1.4), t, dt);

    const ps = L.md * (L.studio ? 0.08 : 0.11);
    let px, py;
    if (studio) { px = studio.pet.x; py = studio.pet.y; }
    else { px = Math.max(ps * 0.8, L.cx - R - L.md * 0.13); py = Math.min(L.H - ps * 2.2, L.cy + R * 0.9); }
    S.petJump = Math.max(0, S.petJump - dt * 1.8);
    const jy = -Math.sin(S.petJump * Math.PI) * ps * 0.6;
    const bob = Math.sin(t * 2.2) * ps * 0.05;
    const petCol = vm.pet >= 8 ? '#c9a8ff' : vm.pet >= 5 ? '#8ecbff' : '#8ef0d0';
    drawPet(ctx, px, py + bob + jy, ps, vm.pet, t, vm.petItems || [], petCol);
    S.objects.push({ kind: 'pet', x: px, y: py, r: ps * 0.65, z: 30 });
    S.petPos = { x: px, y: py - ps * 0.7 };
    S.layout = { cx: Lc.cx, cy: Lc.cy, R: L.studio ? center.R : (p.cat === 'planet' || p.cat === 'star' ? R : Ru) };
    S.placed = placed;

    drawFx(dt);
  }

  /* ---------- 효과 파티클 ---------- */
  function drawFx(dt) {
    const ctx = S.fctx, dpr = S.dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!S.particles.length && !S.fxDirty) return;
    ctx.clearRect(0, 0, S.W, S.H);
    S.fxDirty = S.particles.length > 0;
    const next = [];
    S.particles.forEach(p => {
      if (p.delay > 0) { p.delay -= dt; next.push(p); return; }
      p.life -= dt;
      if (p.life <= 0) { if (p.onEnd) p.onEnd(); return; }
      const k = 1 - p.life / p.max;
      if (p.fly) {
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        const mx = (p.sx + p.tx) / 2 + p.cx, my = Math.min(p.sy, p.ty) - p.cy;
        p.x = (1 - e) * (1 - e) * p.sx + 2 * (1 - e) * e * mx + e * e * p.tx;
        p.y = (1 - e) * (1 - e) * p.sy + 2 * (1 - e) * e * my + e * e * p.ty;
      } else {
        p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(p.drag || 0.4, dt);
        p.vy *= Math.pow(p.drag || 0.4, dt);
      }
      const a = p.fly ? 1 : Math.min(1, p.life / p.max * 1.6);
      ctx.globalAlpha = a;
      if (p.type === 'confetti') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + k * 12); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
      } else if (p.type === 'star') {
        ctx.fillStyle = p.color; star5(ctx, p.x, p.y, p.size, k * 6); ctx.fill();
      } else if (p.type === 'ringwave') {
        ctx.strokeStyle = p.color; ctx.lineWidth = 3 * (1 - k); ctx.beginPath(); ctx.arc(p.x, p.y, p.size * k, 0, TAU); ctx.stroke();
      } else {
        glow(ctx, p.x, p.y, p.size * 2.2, hexRgb(p.color), 0.9); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.45, 0, TAU); ctx.fill();
      }
      next.push(p);
    });
    ctx.globalAlpha = 1;
    S.particles = next;
  }
  function burst(x, y, colors, n, opt) {
    opt = opt || {};
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = (opt.speed || 260) * (0.3 + Math.random());
      S.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opt.up || 0), g: opt.g || 0, life: (opt.life || 0.9) * (0.6 + Math.random() * 0.6), max: opt.life || 0.9,
        color: colors[i % colors.length], size: (opt.size || 5) * (0.6 + Math.random() * 0.8), type: opt.type || (i % 3 ? 'dot' : 'star'), rot: Math.random() * 6, drag: opt.drag });
    }
    S.fxDirty = true;
  }
  function confetti() {
    const cols = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff8fab', '#b983ff'];
    for (let i = 0; i < 140; i++) {
      S.particles.push({ x: Math.random() * S.W, y: -20 - Math.random() * S.H * 0.3, vx: (Math.random() - 0.5) * 120, vy: 120 + Math.random() * 220, g: 60,
        life: 3 + Math.random() * 1.5, max: 4.5, color: cols[i % cols.length], size: 8 + Math.random() * 6, type: 'confetti', rot: Math.random() * 6, drag: 0.9 });
    }
    S.fxDirty = true;
  }
  function flyTo(sx, sy, tx, ty, color, n, onArrive) {
    for (let i = 0; i < n; i++) {
      S.particles.push({ fly: true, sx: sx + (Math.random() - 0.5) * 30, sy: sy + (Math.random() - 0.5) * 20, tx, ty, cx: (Math.random() - 0.5) * 200, cy: 60 + Math.random() * 120,
        x: sx, y: sy, life: 0.9 + i * 0.03, max: 0.9 + i * 0.03, delay: i * 0.035, color, size: 6, type: 'dot',
        onEnd: i === n - 1 ? () => { burst(tx, ty, [color, '#ffffff'], 16, { speed: 160, life: 0.6 }); if (onArrive) onArrive(); } : null });
    }
    S.fxDirty = true;
  }
  function ringWave(x, y, size, color) { S.particles.push({ x, y, vx: 0, vy: 0, life: 0.8, max: 0.8, color, size, type: 'ringwave' }); S.fxDirty = true; }

  /* 분야별 목표 위치 (보상 파티클이 날아갈 곳) */
  function targetFor(cat, sub) {
    const L = S.layout || { cx: S.W / 2, cy: S.H / 2, R: 50 };
    if (cat === 'study' && S.placed) { const m = S.placed.find(p => p.o.kind === 'subject' && p.o.id === sub); if (m) return { x: m.x, y: m.y }; }
    if (cat === 'help' && S.placed) { const m = S.placed.find(p => p.o.kind === 'station'); if (m) return { x: m.x, y: m.y }; }
    if (cat === 'kind' && S.petPos) return S.petPos;
    if (cat === 'arts') return { x: L.cx + L.R * 1.6, y: L.cy + L.R * 0.3 };
    if (cat === 'grade') { const i = PQ.Engine.constInfo(S.vm ? S.vm.stars : 0).current; const sl = PQ.CONST_SLOTS[Math.max(0, i)] || [0.5, 0.2]; return { x: sl[0] * S.W, y: sl[1] * S.H }; }
    return { x: L.cx, y: L.cy };
  }

  function hitTest(x, y) {
    const hits = S.objects.filter(o => Math.hypot(o.x - x, o.y - y) <= o.r).sort((a, b) => b.z - a.z);
    if (!hits.length) return null;
    const nonRing = hits.filter(h => h.kind !== 'ring' && h.kind !== 'const');
    return nonRing[0] || hits[0];
  }

  return {
    init, resize, setView, frame, hitTest, burst, confetti, flyTo, ringWave, targetFor, planetThumb, stageIcon, getTexture,
    _util: { fbm, sstep, mix, hexRgb, rgbStr, glow, star5 },
    spin(v) { S.spinVel += v; }, setShift(px) { S.shiftTarget = px; }, wobble() { S.planetWobble = 1; }, petJump() { S.petJump = 1; },
    comet() { S.comet = { t: 0 }; }, layoutInfo() { return S.layout; }, petPos() { return S.petPos; }, state: S,
    setSafe(sf) { S.safe = sf; }
  };
})();

<script>
/* 플래닛 키즈 - 우주 단계 렌더러: 항성 표면, 항성계·성단, 은하, 은하군·은하단, 초은하단, 우주 거대구조, 관측 가능한 우주,
   다중우주 색감, 우주 창조자 작업실(아빠 프로그래머 & 엄마) */
window.PQ = window.PQ || {};

PQ.Cosmos = (function () {
  const TAU = Math.PI * 2;
  const U = () => PQ.Render._util;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  /* ---------- 다중우주 색 변환 ---------- */
  function tint(c, u) {
    const uv = PQ.UNIVERSES[u || 0];
    if (!uv || uv.mode === 'normal') return c;
    const r = c[0], g = c[1], b = c[2], l = 0.3 * r + 0.59 * g + 0.11 * b;
    let o;
    if (uv.mode === 'hue') {
      const a = uv.hue * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
      o = [r * (.213 + .787 * cs - .213 * sn) + g * (.715 - .715 * cs - .715 * sn) + b * (.072 - .072 * cs + .928 * sn),
        r * (.213 - .213 * cs + .143 * sn) + g * (.715 + .285 * cs + .140 * sn) + b * (.072 - .072 * cs - .283 * sn),
        r * (.213 - .213 * cs - .787 * sn) + g * (.715 - .715 * cs + .715 * sn) + b * (.072 + .928 * cs + .072 * sn)];
    } else if (uv.mode === 'crystal') o = [r * 0.25 + l * 0.6, g * 0.25 + l * 0.8, b * 0.25 + l * 1.0 + 30];
    else o = [r * 0.3 + l * 0.95 + 20, g * 0.3 + l * 0.75, b * 0.3 + l * 0.3];
    return [clamp(o[0], 0, 255), clamp(o[1], 0, 255), clamp(o[2], 0, 255)];
  }
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  function seeded(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }
  function gauss(rnd) { return Math.sqrt(-2 * Math.log(Math.max(1e-6, rnd()))) * Math.cos(TAU * rnd()); }
  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h || w; return c; }

  /* 부드러운 빛 점 (색깔별로 캐시) */
  const dotCache = {};
  function softDot(c) {
    const key = c.map(v => v | 0).join();
    if (dotCache[key]) return dotCache[key];
    const cv = canvas(64), x = cv.getContext('2d');
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, rgba(c, 1)); g.addColorStop(0.25, rgba(c, 0.55)); g.addColorStop(1, rgba(c, 0));
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);

    const DN = ['일', '월', '화', '수', '목', '금', '토'];
    let h = '';
    for (let i = 0; i < 7; i++) { const d = E.addDays(g.week, i); h += `<i class="${d < g.today ? 'past' : d === g.today ? 'today' : ''}">${DN[E.weekdayOf(d)]}</i>`; }
    return `<div class="wstrip">${h}</div>`;
  }
  function weeklyMsg(g, wg) {
    if (g.awarded) return '🎉 완벽한 한 주! 특별 보상을 받았어요. 다음 주에도 도전해요 💪';
    if (!g.possible) return g.firstWeek
      ? '🌱 이번 주는 중간에 시작해서 <b>연습 주간</b>이에요. ❌ 항목은 일요일까지 해도 채울 수 없지만, 미션 경험치는 그대로 받아요! 다음 주 월요일부터 진짜 도전!'
      : '😢 ❌ 항목은 일요일까지 매일 해도 채울 수 없어서 이번 주 특별 보상은 어려워요. 그래도 미션마다 경험치·코인은 그대로 받아요! <b>다음 주 월요일</b>에 새로 시작 💪';
    if (g.left === 0) return '⏳ 다 했어요! 부모님 승인이 끝나면 특별 보상을 받아요.';
    return g.daysLeft === 1
      ? `⏰ <b>오늘이 이번 주 마지막 날!</b> 남은 ${g.left}개를 오늘 끝내면 +${wg.xp} XP!`
      : `일요일까지 <b>${g.daysLeft}일</b> (오늘 포함) · 남은 미션 <b>${g.left}개</b>를 다 하면 +${wg.xp} XP · 🪙${wg.coins}!`;
  }
  function weeklyCard(c, t) {
    const wg = st.settings.weeklyGoal;
    if (!wg || !wg.enabled) return '';
    const g = E.weeklyGoal(st, c, t);
    if (!g.items.length) return '';
    const pct = g.need ? g.done / g.need : 0;
    const col = g.awarded ? 'var(--good)' : !g.possible ? 'rgba(255,255,255,.25)' : 'var(--gold)';
    return `<div class="card wcard ${g.possible ? '' : 'lost'}" style="border-color:${col};margin:8px 0">
      <div class="row"><b class="grow">🗓️ 이번 주 특별 보상 ${g.awarded ? '✅' : ''}</b><span class="rw">+${wg.xp} XP · 🪙${wg.coins}</span></div>
      ${weekStrip(g)}
      <div class="tbar" style="--c:linear-gradient(90deg,#ffd54f,#ff8a65);margin:8px 0"><i style="width:${Math.round(pct * 100)}%"></i></div>
      <div class="wrows">${weeklyRows(g)}</div>
      <p class="muted" style="margin:8px 0 0">${weeklyMsg(g, wg)}</p></div>`;
  }

  /* ---------- 미션 ---------- */
  function renderMissions(c) {
    const t = now(), slot = E.slotFor(st, t);
    const wgs = st.settings.weeklyGoal;
    wkMap = {};
    if (wgs && wgs.enabled) { const g0 = E.weeklyGoal(st, c, t); wkDays = g0.daysLeft; wkFirst = g0.firstWeek; g0.items.forEach(x => { wkMap[x.m.id] = x; }); }
    const slots = st.settings.timeSlots.slice().sort((a, b) => a.until - b.until);
    let html = `<div class="timebar">${slots.map((s, i) => {
      const label = i === slots.length - 1 ? `${hourLabel(slots[i - 1] ? slots[i - 1].until : 0)} 이후` : `${hourLabel(s.until)} 전`;
      return `<div class="${i === slot.idx ? 'now' : i < slot.idx ? 'past' : ''}"><b>${s.pct}%</b>${label}</div>`;
    }).join('')}</div>
    <div class="timenote">${slot.idx === 0 ? '🌟 지금 하면 경험치 100%! 일찍 끝내고 놀자!' : slot.last ? '🌙 늦었지만 해내면 경험치를 받아요. 안 하면 0이에요!' : `⏰ 지금은 ${slot.pct}%! ${fmtLeft(slot.msLeft)} 뒤엔 더 줄어들어요`}</div>
    ${(c.items && (c.items.time || c.items.double)) ? `<div class="timenote" style="color:var(--gold)">${c.items.time ? `⏰ 타임머신 ${c.items.time}개 대기 중 ` : ''}${c.items.double ? `⚡ 더블 부스터 ${c.items.double}개 대기 중` : ''}</div>` : ''}
    ${weeklyCard(c, t)}
    <div class="chips">${['all'].concat(PQ.CAT_ORDER).map(k => `<button class="fchip ${ui.filter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${k === 'all' ? '전체' : PQ.CATS[k].icon + ' ' + PQ.CATS[k].name}</button>`).join('')}</div>`;
    const todayKey = E.dayKey(st, t);
    const ms = st.missions.filter(m => {
      if (m.type === 'surprise') return E.missionAvailable(st, c, m, t) || (m.expiresAt > t - 3600000 && E.missionStatus(st, c, m, t).everDone);
      if (!E.missionAvailable(st, c, m, t)) return false;
      if (m.type === 'once') { const s = E.missionStatus(st, c, m, t); return !s.everDone || (s.last && s.last.dk === todayKey); }
      return true;
    });
    const sur = ms.filter(m => m.type === 'surprise' && (ui.filter === 'all' || ui.filter === m.cat));
    if (sur.length) {
      html += `<div class="cat-head"><span class="cbar" style="background:#ff7a59"></span>☄️ 돌발 미션 <small>보상 ×배율!</small></div>`;
      html += sur.map(m => missionCard(m, c, t)).join('');
    }
    let any = sur.length > 0;
    PQ.CAT_ORDER.forEach(k => {
      if (ui.filter !== 'all' && ui.filter !== k) return;
      const list = ms.filter(m => m.cat === k && m.type !== 'surprise');
      if (!list.length) return;
      any = true;
      const withSt = list.map(m => ({ m, s: E.missionStatus(st, c, m, t) })).sort((a, b) => (b.s.canDo - a.s.canDo));
      const cat = PQ.CATS[k];
      html += `<div class="cat-head"><span class="cbar" style="background:${cat.color}"></span>${cat.icon} ${cat.name} <small>→ ${cat.trackIcon} ${cat.track}</small></div>`;
      html += withSt.map(x => missionCard(x.m, c, t, x.s)).join('');
    });
    if (!any) html += `<div class="empty"><div>🛸</div>오늘은 미션이 없어요!<br>부모님께 미션을 만들어 달라고 해 보세요.</div>`;
    html += `<p class="muted" style="text-align:center;margin-top:18px">💡 버튼을 <b>꾹</b> 누르면 완료돼요 · 여러 분야를 골고루 하면 콤보 보너스!</p>`;
    return html;
  }
  function missionCard(m, c, t, s) {
    s = s || E.missionStatus(st, c, m, t);
    const cat = PQ.CATS[m.cat];
    const rw = E.computeReward(st, m, t, 'excellent');
    const reward = m.cat === 'grade' ? `최대 +${rw.xp} XP · ⭐×3` : `+${rw.xp} XP · 🪙${rw.coins}`;
    const meta = [];
    const sn = subName(m.cat, m.sub);
    if (sn && m.cat !== 'grade') meta.push(`<span class="tag">${esc(sn)}</span>`);
    meta.push(`<span class="rw">${reward}</span>`);
    if (m.type === 'surprise') meta.push(`<span class="tag" style="background:#ff7a59">×${m.mult} · ${fmtLeft(m.expiresAt - t)} 남음</span>`);
    else if (m.timeBonus !== false && rw.pct < 100) meta.push(`<span class="tag">⏰ ${rw.pct}%</span>`);
    if (s.max !== 1 && m.type === 'daily') meta.push(`<span>오늘 ${s.count}/${s.max || '∞'}</span>`);
    if (m.type === 'weekly' && !wkMap[m.id]) meta.push(`<span class="tag">이번 주 ${s.weekCount}/${s.perWeek}</span>`);
    const wx = wkMap[m.id];
    if (wx) {
      const lbl = wx.status === 'done' ? `★ 이번 주 ${wx.need}/${wx.need} 완료` : wx.status === 'pending' ? `★ 이번 주 ${wx.live}/${wx.need} (승인 대기)`
        : wx.status === 'missed' ? `★ 이번 주 ${wx.live}/${wx.need} · ${wkFirst ? '연습 주간' : '보상 놓침'}` : wx.status === 'urgent' ? `★ 이번 주 ${wx.live}/${wx.need} · 🔥 ${urgentText(wx, wkDays)}` : `★ 이번 주 ${wx.live}/${wx.need} · ${wx.left}번 더`;
      meta.push(`<span class="wtag ${wx.status}" title="필수 항목 (주간 특별 보상)">${lbl}</span>`);
    } else if (m.weekly) meta.push('<span title="필수 항목 (주간 특별 보상)" style="color:var(--gold)">★필수</span>');
    if (m.approval) meta.push('<span>👪 승인 필요</span>');
    if (m.type === 'once') meta.push('<span>⭐ 한 번만</span>');
    let right;
    if (s.canDo) right = `<button class="hold" data-hold="${m.id}" style="--c:${cat.color}" aria-label="완료"><span><em>${m.cat === 'grade' ? '📝' : '✔'}</em>꾹</span></button>`;
    else if (s.pending) right = `<div class="state pend"><span class="big">⏳</span>승인 대기</div>`;
    else if (m.type === 'weekly' && s.weekDone && !s.count) right = `<div class="state ok"><span class="big">🗓️</span>이번 주 끝!</div>`;
    else {
      const last = s.last;
      right = `<div class="state ok"><span class="big">✅</span>${last ? '+' + last.xp + 'XP' : '완료'}</div>`;
    }
    const done = !s.canDo;
    return `<div class="mcard ${done ? 'done' : ''} ${m.type === 'surprise' ? 'surprise' : ''}" data-mid="${esc(m.id)}" style="--c:${cat.color}">
      <div class="micon">${esc(m.icon)}</div>
      <div class="mbody"><div class="mtitle">${esc(m.title)}</div><div class="mmeta">${meta.join('')}</div></div>${right}</div>`;
  }

  function startHold(b) {
    A.unlock();
    const start = performance.now();
    let done = false, raf = 0;
    b.classList.add('holding');
    A.play('tap');
    const step = () => {
      if (!b.isConnected || !b.closest('#sheet.open')) { cancelAnimationFrame(raf); cleanup(); return; }
      const p = Math.min(1, (performance.now() - start) / 550);
      b.style.setProperty('--p', p);
      if (p >= 1) { done = true; cleanup(); onHoldComplete(b.dataset.hold, b); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    const cancel = () => { if (done) return; cancelAnimationFrame(raf); cleanup(); b.style.setProperty('--p', 0); };
    function cleanup() { b.classList.remove('holding'); window.removeEventListener('pointerup', cancel); window.removeEventListener('pointercancel', cancel); }
    window.addEventListener('pointerup', cancel);
    window.addEventListener('pointercancel', cancel);
  }
  function onHoldComplete(id, el) {
    const m = st.missions.find(x => x.id === id);
    if (!m) return;
    vibrate(25);
    if (m.cat === 'grade') openGradeModal(m, el);
    else doSubmit(m, {}, el);
  }
  function doSubmit(m, opts, el) {
    const c = child();
    const r = E.submit(st, c.id, m.id, opts, now());
    if (!r.ok) { A.play('error'); toast('⚠️', '지금은 완료할 수 없는 미션이에요'); refresh(); return; }
    save();
    const rect = el && el.isConnected ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
    const sx = rect.left + rect.width / 2, sy = rect.top + rect.height / 2;
    R.burst(sx, sy, [PQ.CATS[m.cat].color, '#ffffff', '#ffd54f'], 26, { speed: 320 });
    ui.lastSource = { x: sx, y: sy };
    if (r.pending) {
      A.play('pending');
      toast('⏳', `<b>부모님 승인을 기다려요</b><small>승인되면 ${r.comp.xp} XP를 받아요 (완료 시각 기준 ${r.comp.pct}%)</small>`, 3500);
    } else A.play('done');
    refresh();
    drainEvents();
  }
  function openGradeModal(m, el) {
    let sub = PQ.SUBS.grade.some(s => s.id === m.sub) && m.sub !== 'etc' ? m.sub : 'math', grade = null;
    const gx = st.settings.gradeXP;
    const html = `<div class="big-emoji">🏆</div><h2>시험 성적 등록</h2><p>어떤 과목 시험이었나요?</p>
      <div class="opt-grid" style="justify-content:center">${PQ.SUBS.grade.map(s => `<button class="opt ${s.id === sub ? 'on' : ''}" data-gs="${s.id}">${s.name}</button>`).join('')}</div>
      <p style="margin-top:16px">결과는 어땠나요?</p>
      <div class="opt-grid" style="justify-content:center">${PQ.GRADES.map(g => `<button class="opt" data-gg="${g.id}" style="min-height:64px;min-width:46%">${g.emoji} ${g.name}<br><small>+${gx[g.id]}XP ${'⭐'.repeat(g.stars)}</small></button>`).join('')}</div>
      <div class="form"><label>시험 이름 (선택)</label><input type="text" id="gname" maxlength="30" placeholder="예: 3단원 단원평가"></div>
      <div class="actions"><button class="btn ghost" data-m="no">취소</button><button class="btn" data-m="ok">등록하기</button></div>`;
    modal(html, {
      onShow(w) {
        w.addEventListener('click', e => {
          const s = e.target.closest('[data-gs]'), g = e.target.closest('[data-gg]');
          if (s) { sub = s.dataset.gs; $$('[data-gs]', w).forEach(b => b.classList.toggle('on', b === s)); A.play('tap'); }
          if (g) { grade = g.dataset.gg; $$('[data-gg]', w).forEach(b => b.classList.toggle('on', b === g)); A.play('tap'); }
        });
      },
      onAction(v, w) {
        if (v !== 'ok') return true;
        if (!grade) { A.play('error'); toast('👆', '결과를 선택해 주세요'); return false; }
        const gname = $('#gname', w).value.trim();
        const label = `${subName('grade', sub)} ${PQ.GRADES.find(x => x.id === grade).name}${gname ? ' (' + gname + ')' : ''}`;
        setTimeout(() => doSubmit(m, { grade, gradeSub: sub, gradeLabel: label }, el), 280);
        return true;
      }
    });
  }

  /* ---------- 이벤트(보상 연출) ---------- */
  function drainEvents() {
    const c = child();
    if (!c || !st.onboarded || (PQ.Parent && PQ.Parent.isOpen())) return;
    if (!c.events.length) return;
    const evs = c.events.splice(0);
    let delay = 0;
    evs.forEach(ev => { setTimeout(() => handleEvent(ev, c), delay); if (['gain', 'combo', 'streak', 'ach'].indexOf(ev.type) >= 0) delay += 420; });
    setTimeout(() => { ui.lastSource = null; }, delay + 100);
  }
  function handleEvent(ev, c) {

      case 'gain': {
        if (ev.praise) {
          celebrate(() => { A.play('level'); R.confetti(); return modal(`<div class="big-emoji">🎉</div><h2>부모님 칭찬!</h2><p><b style="font-size:18px">"${esc(ev.title)}"</b></p>
            <div class="reward-row">${ev.xp ? `<span>+${ev.xp} XP</span>` : ''}<span>🪙 +${ev.coins}</span>${ev.xp ? `<span>${PQ.CATS[ev.cat].trackIcon} ${PQ.CATS[ev.cat].track}</span>` : ''}</div><p>정말 잘했어요! 부모님이 자랑스러워해요 💕</p>
            <div class="actions"><button class="btn" data-m="ok">고맙습니다! 😊</button></div>`); });
          break;
        }
        const src = ui.lastSource || { x: innerWidth / 2, y: innerHeight * 0.75 };
        const tg = R.targetFor(ev.cat, ev.sub);
        R.flyTo(src.x, src.y, tg.x, tg.y, cat.color, 12, () => { A.play('coin'); R.ringWave(tg.x, tg.y, 60, cat.color); });
        const extra = [];
        if (ev.pct < 100) extra.push(`시간 보너스 ${ev.pct}%`);
        if (ev.mult > 1) extra.push(`돌발 ×${ev.mult}`);
        if (ev.stars) extra.push(`⭐ 별 ${ev.stars}개가 밝아졌어요`);
        if (ev.items && ev.items.indexOf('time') >= 0) extra.push('⏰ 타임머신 사용');
        if (ev.items && ev.items.indexOf('double') >= 0) extra.push('⚡ 더블 부스터 ×2');
        toast(ev.approved ? '✅' : esc(ev.icon), `${ev.approved ? '<small>부모님이 승인했어요!</small>' : ''}<span class="xp">+${ev.xp} XP</span> · 🪙${ev.coins}<small>${esc(ev.title)}${extra.length ? ' · ' + extra.join(' · ') : ''}</small>`);
        if (ev.approved) A.play('done');
        break;
      }
      case 'combo': A.play('combo'); R.burst(innerWidth / 2, innerHeight * 0.4, ['#ffd54f', '#ff8fab', '#7c5cff', '#36c2ff'], 30, { speed: 380 });
        toast(ev.icon, `<b>${esc(ev.name)}!</b> <span class="xp">+${ev.xp} XP</span><small>여러 분야를 골고루 했어요</small>`); break;
      case 'streak': toast('🔥', `<b>${ev.days}일 연속 미션!</b><small>+${ev.coins} 코인 보너스</small>`, 3500); break;
      case 'crate': toast('📦', '<b>보급 상자 도착!</b><small>오른쪽 상자 버튼을 눌러 열어 보세요</small>', 3500); break;
      case 'ach': toast(ev.icon, `<b>업적 달성: ${esc(ev.name)}</b><small>+${ev.coins} 코인</small>`, 3500); A.play('combo'); break;
      case 'rejected': toast('🙏', `<b>${esc(ev.title)}</b><small>부모님이 다시 확인해 달래요</small>`, 3500); break;
      case 'rewardNo': toast('↩️', `<b>${esc(ev.title)} 쿠폰</b><small>${ev.cost ? `부모님이 환불해서 ${ev.cost} 코인을 돌려받았어요` : '부모님이 쿠폰을 회수했어요'}</small>`, 3500); break;
      case 'freeze': toast('🛡️', '<b>보호막 발동!</b><small>어제 쉬었지만 연속 기록을 지켰어요</small>', 3500); break;
      case 'weekly': celebrate(() => { A.play('level'); R.confetti(); setTimeout(() => R.confetti(), 700); return modal(`<div class="levelup-title">완벽한 한 주!</div><div class="big-emoji">🗓️</div>
        <h2>주간 특별 보상!</h2><p>이번 주 ★필수 미션 ${ev.missions}가지를 <b>모두</b> 해냈어요!<br>정말 대단해요 👏</p>
        <div class="reward-row"><span>+${ev.xp} XP</span><span>🪙 +${ev.coins}</span></div>
        <div class="actions"><button class="btn" data-m="ok">최고의 한 주! 🎉</button></div>`); }); break;
      case 'coupon': celebrate(() => { A.play('combo'); R.confetti(); return modal(`<div class="big-emoji">🎟️</div><h2>선물 쿠폰 도착!</h2><p>부모님이 <b>${esc(ev.icon)} ${esc(ev.title)}</b> 쿠폰을 선물했어요!<br>🎁 상점 → 내 쿠폰함에서 원할 때 사용하세요.</p><div class="actions"><button class="btn" data-m="ok">고맙습니다! 💕</button></div>`); }); break;
      case 'penalty': celebrate(() => { A.play('error'); return modal(`<div class="big-emoji">😢</div><h2>부모님 메시지</h2><p><b style="font-size:18px">"${esc(ev.reason)}"</b></p>
        <div class="reward-row">${ev.coupon ? `<span style="background:rgba(255,107,107,.25)">🎟️ ${esc(ev.giftIcon || '')} ${esc(ev.gift || '')} 쿠폰 −1</span>` : ev.gift ? `<span style="background:rgba(255,107,107,.25)">${esc(ev.giftIcon || '')} ${esc(ev.gift)} 만큼 🪙 −${ev.coins}</span>` : ev.coins ? `<span style="background:rgba(255,107,107,.25)">🪙 −${ev.coins}</span>` : ''}${ev.xp ? `<span style="background:rgba(255,107,107,.25)">−${ev.xp} XP</span>` : ''}</div>
        ${typeof ev.balance === 'number' && ev.balance < 0 ? `<p style="color:#ff8a80"><b>지금 코인 🪙${ev.balance}</b><br>마이너스 코인은 미션으로 먼저 채워야 해요. 0이 넘으면 다시 선물을 살 수 있어요.</p>` : ''}
        <p>괜찮아요, 누구나 실수할 수 있어요.<br>다음엔 더 잘할 수 있어! 💪 미션으로 다시 모아 봐요.</p>
        <div class="actions"><button class="btn" data-m="ok">다음엔 잘할게요!</button></div>`); }); break;
      case 'rewardOk': celebrate(() => { A.play('level'); R.confetti(); return modal(`<div class="big-emoji">${esc(ev.icon)}</div><h2>쿠폰 사용 완료!</h2><p>"${esc(ev.title)}" 쿠폰을 부모님이 확인했어요!<br>즐겁게 누리세요 😊</p><div class="actions"><button class="btn" data-m="ok">신난다!</button></div>`); }); break;

        break;
      }
      case 'constellation': celebrate(() => { const k = PQ.CONSTELLATIONS[ev.idx]; A.play('level'); R.confetti(); closeSheet(); return modal(`<div class="big-emoji">✨</div><h2>${esc(k.name)} 완성!</h2><p>좋은 성적으로 밤하늘에 별자리가 그려졌어요.<br>하늘을 올려다 보세요!</p><div class="actions"><button class="btn" data-m="ok">반짝반짝!</button></div>`); }); break;
    }
  }

  function trackModal(ev, c) {

  }

  /* ---------- 발전 탭 ---------- */
  function renderGrowth(c) {
    const li = E.levelInfo(c.xp, st.settings.levelSpeed);
    const ordNow = li.phase === 'cycle' ? li.stageIdx : PQ.STAGES.length;
    const allOpen = li.universe > 0 || li.phase !== 'cycle';
    let html = `<div class="section-title">🚀 우주 여행 <small>Lv.${li.level} · ${esc(stageLabel(li))}</small></div>`;
    if (li.phase !== 'cycle') html += `<div class="card">${li.phase === 'creator' ? '👨‍💻 <b>우주 창조자의 작업실</b>' : '👨‍👩‍👧 <b>창조자 가족</b>'} · 5개의 우주를 모두 완성했어요! ${li.phase === 'creator' ? `작업실 ${li.creatorLv}/${PQ.CREATOR_LEVELS}단계` : `★${li.familyLv}`}</div>`;
    else html += `<div class="card"><b>${esc(PQ.UNIVERSES[li.universe].name)} · ${esc(PQ.UNIVERSES[li.universe].title)}</b> <span class="muted">(다중우주 ${li.universe + 1}/${PQ.UNIVERSE_COUNT})</span></div>`;
    html += '<div class="journey" id="journey">';
    let lastCat = '';
    PQ.STAGES.forEach((p, i) => {
      const open = allOpen || i <= ordNow;
      if (p.cat !== lastCat) { lastCat = p.cat; html += `<div class="jp" style="width:auto;align-self:center;color:var(--accent2)">${PQ.STAGE_CATS[p.cat].icon}<br>${open ? PQ.STAGE_CATS[p.cat].name : '???'}</div>`; }
      html += `<div class="jp ${i === li.stageIdx && li.phase === 'cycle' ? 'cur' : ''} ${open ? '' : 'lock'}"><div class="pimg">${open ? `<img data-ti="${i}" data-ts="144" alt="">` : '❔'}</div>${open ? esc(p.name) : '???'}</div>`;
    });
    html += `</div><div class="card"><div class="row"><b class="grow">다음 레벨까지</b><span class="rw">${li.need - li.cur} XP</span></div><div class="tbar" style="--c:linear-gradient(90deg,#ffd54f,#ff5fa2);margin-top:8px"><i style="width:${li.pct * 100}%"></i></div></div>`;

    const tracks = trackStates(c);
    const weakest = tracks.slice().sort((a, b) => a.score - b.score)[0];
    html += `<div class="card" style="border-color:${PQ.CATS[weakest.cat].color}">💡 <b>추천:</b> ${PQ.CATS[weakest.cat].icon} <b>${PQ.CATS[weakest.cat].name}</b> 미션을 해 보세요! ${PQ.CATS[weakest.cat].trackIcon} ${PQ.CATS[weakest.cat].track}이(가) 기다리고 있어요.</div>`;
    html += `<div class="section-title">🚀 5가지 발전 <small>분야마다 다른 것이 자라요</small></div>`;
    const sv = PQ.SUBS.study.map(s => ({ s, ti: E.trackInfo(c.subE[s.id] || 0, PQ.MOON_THRESHOLDS) }));
    html += `<div class="track" style="--c:${PQ.CATS.study.color}"><h3>🌙 지식 위성 <span class="lvb">${sv.filter(x => x.ti.level > 0).length}/${sv.length}개</span></h3><p>${PQ.CATS.study.desc}</p>
      <div class="moons">${sv.map(x => `<div class="moon"><div class="orb ${x.ti.level ? '' : 'off'}" style="background:radial-gradient(circle at 35% 30%, #fff8, ${x.s.color} 45%, #0006)">${x.s.sym}</div>${x.s.name}<div class="lvdots">Lv.${x.ti.level}/10${x.ti.stars ? ' ★' + x.ti.stars : ''}</div>
      <div class="tbar" style="--c:${x.s.color};height:5px;margin-top:4px"><i style="width:${x.ti.frac * 100}%"></i></div></div>`).join('')}</div></div>`;
    tracks.filter(t => t.cat !== 'study').forEach(t => {
      const cat = PQ.CATS[t.cat];
      let extra = '';
      if (t.cat === 'arts') {
        const tot = PQ.SUBS.arts.reduce((a, s) => a + (c.artE[s.id] || 0), 0);
        extra = `<div class="legend">${PQ.SUBS.arts.map(s => `<span><i style="background:${s.color}"></i>${s.name} ${tot ? Math.round((c.artE[s.id] || 0) / tot * 100) : 0}%</span>`).join('')}</div>`;
      }
      if (t.cat === 'grade') {
        const ci = E.constInfo(c.gradeStars);
        extra = `<div class="legend">${PQ.CONSTELLATIONS.map((k, i) => `<span>${ci.lit[i] === k.stars.length ? '✨' : '☆'} ${k.name} ${ci.lit[i]}/${k.stars.length}</span>`).join('')}</div>`;
      }
      if (t.cat === 'kind') extra = `<div class="row" style="margin-top:10px"><span class="muted grow">펫 이름: <b style="color:#fff">${esc(c.petName)}</b></span><button class="btn small ghost" data-act="renamePet">✏️ 이름 바꾸기</button></div>`;
      html += `<div class="track" style="--c:${cat.color}"><h3>${cat.trackIcon} ${cat.track} <span class="lvb">${t.label}</span></h3><p>${t.desc}</p>
        <div class="tbar"><i style="width:${t.frac * 100}%"></i></div><p class="muted" style="margin:6px 0 0">${t.next}</p>${extra}</div>`;
    });
    const day = (c.daily[E.dayKey(st, now())] || { combos: [] }).combos;
    html += `<div class="section-title">🌈 오늘의 콤보 <small>하루에 한 번씩 받을 수 있어요</small></div><div class="combo-list">`;
    html += PQ.CAT_COMBOS.map(k => `<div class="combo ${day.indexOf(k.id) >= 0 ? 'got' : ''}"><b>${k.icon} ${k.name}</b>${k.n}개 분야 · +${k.xp}XP</div>`).join('');
    html += PQ.LINK_COMBOS.map(k => `<div class="combo ${day.indexOf(k.id) >= 0 ? 'got' : ''}"><b>${k.icon} ${k.name}</b>${k.desc} · +${k.xp}XP</div>`).join('');
    html += `</div><div class="section-title">🏅 업적 <small>${Object.keys(c.ach).length}/${PQ.ACHIEVEMENTS.length}</small></div><div class="ach-grid">`;
    html += PQ.ACHIEVEMENTS.map(a => `<div class="ach ${c.ach[a.id] ? 'got' : ''}"><div>${a.icon}</div><b>${a.name}</b>${a.desc}</div>`).join('');
    return html + '</div>';
  }
  function trackStates(c) {
    const out = [];
    const sv = PQ.SUBS.study.map(s => E.trackInfo(c.subE[s.id] || 0, PQ.MOON_THRESHOLDS));
    out.push({ cat: 'study', score: sv.reduce((a, t) => a + t.level + t.frac, 0) / sv.length / 5 });
    const a = E.trackInfo(c.energy.arts || 0, PQ.TRACK_THRESHOLDS.arts);
    out.push({ cat: 'arts', score: (a.level + a.frac) / a.max, frac: a.frac, label: `Lv.${a.level}${a.stars ? ' ★' + a.stars : ''}`, desc: `${PQ.RING_STAGES[a.level]} · ${PQ.CATS.arts.desc}`, next: a.next ? `다음 단계까지 ${a.next - a.energy} 에너지 (예체능 미션)` : '최고 단계 달성! 🎉' });
    const h = E.trackInfo(c.energy.help || 0, PQ.TRACK_THRESHOLDS.help);
    out.push({ cat: 'help', score: (h.level + h.frac) / h.max, frac: h.frac, label: `Lv.${h.level}${h.stars ? ' ★' + h.stars : ''}`, desc: `${h.level ? '현재 모듈: ' + PQ.STATION_MODULES[h.level] + ' · ' : ''}${PQ.CATS.help.desc}`, next: h.next ? `다음 모듈 "${PQ.STATION_MODULES[h.level + 1]}"까지 ${h.next - h.energy} 에너지` : '우주정거장 완공! 🎉' });
    const ci = E.constInfo(c.gradeStars);
    out.push({ cat: 'grade', score: c.gradeStars / ci.total, frac: ci.current >= 0 ? ci.lit[ci.current] / PQ.CONSTELLATIONS[ci.current].stars.length : 1, label: `${ci.completed}/${PQ.CONSTELLATIONS.length}`, desc: PQ.CATS.grade.desc, next: ci.current >= 0 ? `지금 밝히는 별자리: ${PQ.CONSTELLATIONS[ci.current].name} (${ci.lit[ci.current]}/${PQ.CONSTELLATIONS[ci.current].stars.length}) · 매우잘함 ⭐3 · 잘함 ⭐2 · 보통 ⭐1` : '모든 별자리 완성! 🌌' });
    const k = E.trackInfo(c.energy.kind || 0, PQ.TRACK_THRESHOLDS.kind);
    out.push({ cat: 'kind', score: (k.level + k.frac) / k.max, frac: k.frac, label: `Lv.${k.level}${k.stars ? ' ★' + k.stars : ''}`, desc: `${PQ.PET_STAGES[k.level]}${k.level >= 2 ? ' ' + esc(c.petName) : ''} · ${PQ.CATS.kind.desc}`, next: k.next ? `다음 진화까지 ${k.next - k.energy} 에너지 (선행·칭찬 미션)` : '전설의 펫 달성! 🐉' });
    return out;
  }

  /* ---------- 상점 ---------- */

      <div class="seg">${[['gift', '🎁 부모님 선물'], ['deco', '✨ 우주 꾸미기'], ['item', '🛡️ 아이템']].map(([k, l]) => `<button class="${ui.shopSeg === k ? 'on' : ''}" data-act="shopSeg" data-s="${k}">${l}</button>`).join('')}</div>`;
